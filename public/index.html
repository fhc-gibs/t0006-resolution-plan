<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>T0006 Resolution Plan</title>
<style>

  /* Layout: single column of item cards (max 960px); each card carries its own live response groups. */
  :root{
    --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f0ede6; --border:#ddd7cb; --border-strong:#c9c1b1;
    --ink:#2a251d; --dim:#6b6253; --accent:#8a5a2b; --accent-ink:#ffffff;
    --warn-bg:#fbeee0; --warn-border:#d9a86c; --warn-ink:#6b3e10;
    --done-bg:#e9f0e6; --done-border:#a9c79c; --done-ink:#3c5c33;
    --field-bg:#ffffff; --field-locked:#f0ede6; --ph:#7a7468; --danger:#a3321f; --live:#3c8a3c; --idle:#8a8374;
    --shadow:0 1px 2px rgba(40,30,10,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1812; --surface:#242019; --surface-2:#2c2720; --border:#3c352a; --border-strong:#51483a;
      --ink:#ede7da; --dim:#aca290; --accent:#d59a5c; --accent-ink:#1b1812;
      --warn-bg:#352515; --warn-border:#7a4e22; --warn-ink:#e8bd84;
      --done-bg:#1f2a1c; --done-border:#3d5635; --done-ink:#9fc48f;
      --field-bg:#1b1812; --field-locked:#2c2720; --ph:#9a917f; --danger:#ef8a77; --live:#6cc06c; --idle:#8a8374;
      --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
      --bg:#1b1812; --surface:#242019; --surface-2:#2c2720; --border:#3c352a; --border-strong:#51483a;
      --ink:#ede7da; --dim:#aca290; --accent:#d59a5c; --accent-ink:#1b1812;
      --warn-bg:#352515; --warn-border:#7a4e22; --warn-ink:#e8bd84;
      --done-bg:#1f2a1c; --done-border:#3d5635; --done-ink:#9fc48f;
      --field-bg:#1b1812; --field-locked:#2c2720; --ph:#9a917f; --danger:#ef8a77; --live:#6cc06c; --idle:#8a8374;
      --shadow:none; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    padding:0 16px 40px;
  }
  .wrap{max-width:960px; margin:0 auto; padding-top:24px}
  h1,h2{font-family:Georgia,"Times New Roman",serif; font-weight:600; text-wrap:balance}
  h1{font-size:clamp(1.35rem,4.5vw,1.8rem); margin:0 0 6px; line-height:1.2}
  h2{font-size:1.15rem; margin:0}
  p{margin:0}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .subtitle{color:var(--dim); font-size:.93rem; margin-bottom:14px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .chip{font-size:.78rem; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:3px 9px}

  .actions{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px}
  .btn{
    appearance:none; cursor:pointer; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:8px; padding:8px 14px; font-size:.88rem; font-weight:600; min-height:40px;
  }
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn-primary:hover{background:var(--accent); filter:brightness(1.08)}
  .statusline{font-size:.82rem; color:var(--dim); display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; margin-bottom:6px}
  .sync{display:inline-flex; align-items:center; gap:6px; font-weight:600}
  .sync::before{content:""; width:9px; height:9px; border-radius:50%; background:#3c8a3c}
  .sync.dirty::before{background:#d08a1a}

  details.howto{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:14px 0 6px; font-size:.9rem}
  details.howto summary{cursor:pointer; font-weight:600}
  details.howto ol{margin:8px 0 0; padding-left:20px}
  details.howto li{margin:3px 0}

  nav.jump{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px}
  nav.jump a{
    text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:5px 12px; font-size:.82rem; font-weight:600; min-height:32px; display:inline-flex; align-items:center;
  }
  nav.jump a:hover{background:var(--surface-2)}

  .callout{background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink); border-radius:10px; padding:14px 16px; margin:18px 0 8px; font-size:.93rem}
  .callout strong{display:block; font-family:Georgia,serif; margin-bottom:4px}

  section.sec{margin-top:30px; scroll-margin-top:12px}
  .sec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; margin-bottom:4px}
  .owner{font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:2px 10px; background:var(--surface-2); border:1px solid var(--border); color:var(--dim)}
  .sec-sub{color:var(--dim); font-size:.86rem; margin-bottom:12px}

  .items{display:flex; flex-direction:column; gap:14px}
  article.item{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
  .item-head{display:flex; gap:10px; align-items:flex-start}
  .num{
    flex:none; min-width:2.4rem; text-align:center; font-weight:700; font-size:.82rem; color:var(--accent-ink);
    background:var(--accent); border-radius:6px; padding:2px 6px; margin-top:2px;
  }
  .item-text{font-size:.96rem; flex:1; min-width:0}
  .pill{
    flex:none; font-size:.66rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
    color:var(--done-ink); background:var(--done-bg); border:1px solid var(--done-border); border-radius:999px; padding:2px 9px; margin-top:3px;
  }
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0 calc(2.4rem + 10px)}
  .tag{font-size:.72rem; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 7px}
  .tag.pg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .finding{margin:10px 0 0; border-radius:8px; padding:9px 12px; font-size:.86rem; line-height:1.45; border:1px solid var(--border); background:var(--surface-2)}
  .finding.ok{background:var(--done-bg); border-color:var(--done-border); color:var(--done-ink)}
  .finding.flag{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-ink)}
  .finding code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8rem; background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px}
  .finding .src{display:block; margin-top:5px; font-size:.75rem; opacity:.85; font-style:italic}

  .resp{margin-top:14px; border-top:1px dashed var(--border-strong); padding-top:12px}
  .groups{display:flex; flex-direction:column; gap:12px}
  .grp{border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface-2)}
  .grp[data-state="editing"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .grp-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 10px; margin-bottom:8px}
  .grp-label{font-size:.8rem; font-weight:700; letter-spacing:.02em; color:var(--dim)}
  .btn-mini{
    appearance:none; cursor:pointer; border:1px solid var(--border-strong); background:var(--surface); border-radius:6px;
    padding:3px 12px; font-size:.78rem; font-weight:700; min-height:30px; line-height:1.2;
  }
  .btn-mini:hover{background:var(--surface-2)}
  .grp[data-state="draft"] .btn-mini, .grp[data-state="editing"] .btn-mini{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  @media (pointer:coarse){ .btn-mini{min-height:38px; padding:5px 16px} }

  .grp-fields{display:grid; grid-template-columns:1fr; gap:8px}
  @media (min-width:640px){ .grp-fields{grid-template-columns:minmax(150px,220px) 1fr} }
  .grp input, .grp textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--field-bg);
    border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px; display:block; margin:0;
  }
  .grp textarea{min-height:44px; resize:vertical; overflow:hidden; line-height:1.4}
  .grp input::placeholder, .grp textarea::placeholder{color:var(--ph); font-style:italic; opacity:1}
  .grp[data-state="locked"] input, .grp[data-state="locked"] textarea{background:var(--field-locked); cursor:default}
  .grp-meta{font-size:.74rem; color:var(--dim); margin-top:6px}
  .grp-err{font-size:.8rem; color:var(--danger); margin-top:6px; font-weight:600}
  .grp-err:empty{display:none}

  .add{
    appearance:none; cursor:pointer; margin-top:12px; background:transparent; border:1px dashed var(--border-strong);
    border-radius:8px; padding:8px 14px; font-size:.85rem; font-weight:600; color:var(--accent); min-height:40px;
  }
  .add:hover{background:var(--surface-2)}

  footer{margin-top:40px; padding-top:14px; border-top:1px solid var(--border); color:var(--dim); font-size:.78rem}

  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30;
    background:#2a251d; color:#fff; padding:9px 16px; border-radius:8px; font-size:.86rem; max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1}

  dialog{
    border:1px solid var(--border-strong); border-radius:14px; padding:0; width:min(640px,calc(100vw - 24px)); max-height:85vh;
    background:var(--surface); color:var(--ink);
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface)}
  .dlg-body{padding:6px 18px 18px; overflow:auto; max-height:calc(85vh - 64px)}
  .dlg-note{font-size:.8rem; color:var(--dim); margin:10px 0}
  ul.hist{list-style:none; margin:0; padding:0}
  .hist-row{padding:10px 0; border-bottom:1px solid var(--border)}
  .hist-top{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-size:.84rem}
  .hist-act.del{color:var(--danger)}
  .hist-act{font-weight:600}
  .hist-top time{color:var(--dim); font-size:.78rem}
  .hist-who{font-size:.84rem; color:var(--dim)}
  .hist-snip{font-size:.84rem; font-style:italic; margin-top:2px; overflow-wrap:anywhere}
  .empty{color:var(--dim); padding:14px 0}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap}
  noscript p{padding:20px; background:var(--warn-bg); color:var(--warn-ink)}

  .sync{color:var(--dim)}
  .sync::before{background:var(--idle)!important}
  .sync.on::before{background:var(--live)!important}
  .banner{background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink); border-radius:10px; padding:10px 14px; margin:0 0 12px; font-size:.9rem}
  .grp-btns{display:inline-flex; gap:6px; flex-wrap:nowrap; justify-content:flex-end; margin-left:auto}
  .btn-main:disabled,.btn-danger:disabled{opacity:.6; cursor:wait}
  .btn-del{color:var(--danger); border-color:var(--danger); background:transparent}
  .btn-del:hover{background:var(--surface)}
  .btn-danger{background:var(--danger)!important; border-color:var(--danger)!important; color:#fff!important}
  .confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:0 0 8px; padding:8px 10px; border:1px solid var(--danger); border-radius:8px; background:var(--field-bg); font-size:.86rem; font-weight:600}
  .confirm[hidden]{display:none}
  .grp input:disabled,.grp textarea:disabled{opacity:.7; cursor:not-allowed}
  .add:disabled{opacity:.5; cursor:not-allowed}



  .pill.open{color:var(--warn-ink); background:var(--warn-bg); border-color:var(--warn-border)}
  .finding{padding:10px 13px}
  .finding-body{font-size:.88rem; line-height:1.5}
  .finding.ok .finding-body strong:first-child, .finding.flag .finding-body strong:first-child{text-transform:uppercase; letter-spacing:.04em; font-size:.72rem}
  .sources{margin-top:9px; padding-top:8px; border-top:1px solid currentColor; border-top-color:color-mix(in srgb, currentColor 30%, transparent); font-size:.78rem; line-height:1.45}
  .sources strong{text-transform:uppercase; letter-spacing:.05em; font-size:.68rem}
  .sources ul{margin:4px 0 0; padding-left:18px}
  .sources li{margin:2px 0; overflow-wrap:anywhere}
  .chip-done{background:var(--done-bg); border-color:var(--done-border); color:var(--done-ink)}
  .chip-open{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-ink)}
  .legend{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:.82rem; color:var(--dim); margin:0 0 12px}
  .sw{display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--border-strong)}
  .sw-done{background:var(--done-bg); border-color:var(--done-border)}
  .tags{min-width:0}
  .tag{max-width:100%; overflow-wrap:anywhere}
  .tag.pg{white-space:normal}
  .sw-open{background:var(--warn-bg); border-color:var(--warn-border); margin-left:8px}
</style>
</head>

<script>
(function(){
'use strict';
var SECTIONS = [{"id": "A", "title": "A. Research questions", "owner": "Owner: Gibs", "sub": "Answered from the SOW, the T0006 pages and the emails. A3 and A4 corrected earlier answers.", "items": [{"id": "A1", "text": "Confirm whether the contract/SOW requires wet-ink vs. digital signatures on transmittal covers and on T0006’s internal documents.", "tags": ["Alex 1:18 PM"], "pg": ["pp.1,2,12"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Nothing in the SOW, solicitation, or contract text sets a wet-ink or digital-signature rule for submittals. Submittals go to the TPOC by email on ENG Form 4025, and ENG Form 6206 itself labels the approval block “Approval Authority (digital signature).” But the SOW requires the APP, SSHO letters, and fall-protection plan to be submitted and accepted before work starts, so T0006 should not go in unsigned. <strong>Action:<\/strong> Sign digitally (the same image-overlay method used on T0005/T0007/T0008) and delete the “pending final wet/digital signature” wording from pages 1 and 2. A one-line confirmation to Travis is optional; no document requires it.", "sources": ["SOW §II Part 1 ¶2 (submittals reviewed and accepted before field activity)", "SOW §I.5.B, §I.5.D, §I.5.H (APP, SSHO letters, fall-protection plan accepted before work)", "Precon meeting minutes (05 Feb 2026) ¶6.a–b", "T0006 pp.1, 2, 12 (cover remarks; ENG 6206 approval block)", "ENG Form 4025 instructions; Contract §G (DFARS 252.232-7003, payment requests only)", "Emails: none found on this point"]}, {"id": "A2", "text": "Pin down the EM-385 requirement: does the SOW require every employee to be EM-385 <em>certified<\/em>, or only a minimum number, with the rest informed?", "tags": ["Alex 1:32 PM"], "pg": ["p.5", "p.8"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> The SOW sets minimums only; it does not require every employee to be EM-385 “certified.” It requires one Level 3 SSHO, a Competent Person with a 24-hour fall-protection course, at least two First Aid/CPR-certified employees on multi-person shifts, and hands-on equipment training for end users. OSHA-30 plus competency proof applies only to designated SSHOs. T0006 Part 5 Item 1 says employees will be <em>trained<\/em>, which is accurate. One conflict found: the p.8 AED row says “Min. 1 certified First Aid/CPR responder,” but the SOW says at least two. <strong>Action:<\/strong> Leave the “trained” wording alone. Change the p.8 AED row to “at least two employees certified in First Aid/CPR per shift.” Justin Turner and Brent Van Brocklin hold the on-site First Aid/CPR cards (pp.45, 47), so both must be on site each shift.", "sources": ["SOW §I.5.D (Level 3 SSHO), §I.5.E (two First Aid/CPR per shift), §I.5.F, §I.5.H.i.1 and i.4", "T0006 p.5 (Part 5 Items 1–3); p.8 (AED row); pp.45, 47 (First Aid/CPR cards)", "Emails: none found on the requirement itself"]}, {"id": "A3", "text": "Determine whether the blank employee-documentation sheets (name / occupation / signature / date) are blank by design or need to be filled out before submission.", "tags": ["Alex 2:17 PM"], "pg": ["pp.13,16,19,22,25,28,31,34,37"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> The nine Employee Documentation Sheets sit after each AHA phase on pp.13, 16, 19, 22, 25, 28, 31, 34 and 37 (the AHA first pages are 11, 14, … 35, so the earlier page list was off by two). The form text says each employee documents their review with a signature before starting the task, and each AHA reads “Reviewed By: field crew review — see Employee Documentation Sheet.” They are meant to be signed in the field, not pre-filled. <strong>Action:<\/strong> Submit them blank. Print copies and have the crew sign as each phase starts, and keep the signed sheets on site.", "sources": ["T0006 pp.13–37 (form instruction on each sheet); p.6 (Part 8 Item 7)", "SOW §I.5.B (preparatory meeting, daily documented safety meetings)", "Precon meeting minutes ¶4.a (hazard-analysis meeting as each phase begins)", "Emails: none found"]}, {"id": "A4", "text": "Confirm the real asphalt-shingle square footage — document reads ~8,000 sq ft; Alex recalls 5,000–6,000.", "tags": ["Alex 1:27 PM"], "pg": ["p.3 Line 5", "p.7", "p.23", "p.26", "p.51"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Correction to the earlier analysis: the ~8,000 SF figure is the Government’s own. SOW §I.1 states “approximately 8000 square feet of asphalt shingles and approximately 1200 square feet” of EPDM, and the precon minutes repeat it. The aerial report shows 5,792 SF sloped plus 1,262 SF flat (70.54 squares total), but it assumes a 7/12 default pitch and notes “verification needed,” so 5,792 SF is an unverified desktop estimate. Changing T0006 to 5,800 would contradict the contract wording. The figure appears 8 times in T0006 (p.3 Line 5; p.7 ×3; p.23 ×2; p.26; p.51). <strong>Action:<\/strong> Keep “approximately 8,000 SF (per SOW §I.1)” on all 8 occurrences, or drop the number and say “per SOW.” If the team prefers 5,800, label it “approx. 5,800 SF per aerial measurement, to be field-verified” and apply it everywhere at once.", "sources": ["SOW §I.1 (project description and quantities)", "Precon meeting minutes ¶3", "Aerial sketch report, 40 Academy Drive (10/27/25): Measurements and Notes pages", "T0006 pp.3, 7, 23, 26, 51", "10/2/26 team chat (Alex recalls 5,000–6,000 SF)", "Emails: none state either figure"]}]}, {"id": "B", "title": "B. Needs a team decision", "owner": "Owner: Zak / Justin / Brent / Earl / Alex", "sub": "Green items are settled by the documents or by the 10/5 team call; the “Action” line on a green item is still work to do in T0006. Amber items still need a decision, a confirmation, or a fact nobody has yet.", "items": [{"id": "B1", "text": "Alternate SSHO designation letter: include it in T0006 now, or hold it for a separate cover submission later? The cover currently defers it.", "tags": ["Alex 1:19 PM"], "pg": ["pp.1,2,4,5,38"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> The alternate SSHO letter is required now, not later. SOW §I.5.D says to designate <em>all<\/em> SSHOs on ENG Form 6282. T0006 already names Brent Van Brocklin as alternate (Part 3 Item 7, p.4; Part 5 Item 2, p.5, with the Alternate SSHO box checked), but the cover and p.2 say his letter is “to follow separately,” which contradicts Part 5 Item 2. The APP must be accepted before work starts, so the alternate would be undesignated at acceptance. Also note a roster change: the precon-approved alternate was Ted Morrison, and the 9/23 email still lists him. Brent’s credentials are in the package (OSHA-30 09-16-2026, p.48; 24-hr CP fall protection 09/30/2026, p.50; CPR 09/26/2026, p.47). <strong>Action:<\/strong> Add Brent’s ENG 6282 now as page 2 of Attachment 0006-C, update the p.1 remarks and the p.2 row (1 page becomes 2), and mention the Morrison-to-Brent change in the cover email. See C5 for who signs.", "pill": "Resolved", "sources": ["SOW §I.5.B and §I.5.D; SOW §II Part 1 ¶2", "T0006 pp.1, 2, 4, 5, 38, 47, 48, 50", "Precon meeting minutes ¶1.b (Ted Morrison as Alt SSHO/QC/Superintendent)", "Email: “Transmittals 0001–0010, reordered materials-first,” 9/23/2026 (names Justin Turner SSHO, Ted Morrison alternate)"]}, {"id": "B2", "text": "Reconcile the fall-protection/material-handling narrative into one consistent story across every page it appears.", "tags": ["Alex 1:40–2:01 PM"], "pg": ["pp.4–7,9,12,14,15,17,18,23,24,27,29,32,35,36,38,51–56"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Decided on the 10/5 team call: roof access is one 32-ft all-terrain scissor lift plus an extension ladder; the staircase, scaffolding and GuardLock are out; the flat roof uses D-rings, ropes and harnesses with flags and cones instead of rails; and debris moves by tarp slide (see F5–F8). T0006 still describes the opposite in most places: the staircase appears on pp.6, 7, 14, 18, 35 and 52, GuardLock on 16 pages (pp.2, 4–7, 9, 17, 18, 29, 32, 35, 52–56), and scaffold wording on 22 pages. It also says no machinery or powered lifting equipment is permitted (pp.7–9, 12, 14, 15, 17, 18, 51, 52), which the scissor lift contradicts. The call reports that Travis accepted the ladder, but the 10/1 notes say he wanted two separate means of access and had said ladders were not permitted, and nothing in writing confirms the new combination. <strong>Action:<\/strong> Rewrite access, egress and hoisting once across T0006 and T0007; the two must match (SOW §II Part 1 ¶2.H). Strike every “no machinery / powered lifting equipment” sentence and add an equipment AHA for the lift (F6). Still to do: get Travis’s one-line email accepting lift plus ladder before the revision goes in: Travis is going on vacation, and whoever covers will enforce only what is written.", "sources": ["T0006 pp.4–7, 9, 12, 14, 15, 17, 18, 23, 24, 27, 29, 32, 35, 36, 38, 51–56 (staircase, scaffold, GuardLock and no-machinery wording)", "Team call transcript (10/5/2026): access, guardrail, scaffolding and debris decisions", "Internal pre-site-visit call notes (10/1/2026) §4 (access, egress, lift rental)", "SOW §II Part 1 ¶2.H (Work Plan covers roof access and hoisting, so T0007 must match T0006)", "Emails: no Cape Cod email covers this"]}, {"id": "B3", "text": "Confirm the fiberglass ladder Justin mentioned (new unit at the Rocky Hill shop) is the one actually going to site.", "tags": ["Alex 1:42 PM / Justin 1:43 PM"], "pg": ["pp.5,7,9,11,12,14,15,18,20,23,24,26,27,29,32,35,36,55,56"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> On the 10/5 call the ladder became a primary access method: an extension ladder pinned into the ground on each side with wire or strap at the base, and a strap (or screws and wire) at the top fixed to the building; no walk-through gate; Justin is the competent person for the ladder and lifts. The call reports that Travis “was good with the ladder,” but the 10/1 notes recorded that he was adamant ladders are not permitted, and nothing in writing settles it. The SOW has no ladder material or type rule. T0006 already says “fiberglass ONLY” and Type IA 300 lb (pp.7, 14, 15, 18, 24, 36, 55) but has no tie-off detail. Which ladder goes to site (the new Rocky Hill unit) was not discussed. <strong>Action:<\/strong> Still to do: get Travis’s written OK for ladders (dormers, eave work, rescue, and roof access). Add the securing method to the ladder AHA and pp.15, 18 and 36, and confirm the Type IA fiberglass unit is staged before elevated work. EM 385 §22 ladder rules are not in the project files; verify them.", "pill": "Resolved", "sources": ["T0006 pp.7, 12, 14, 15, 18, 24, 36, 55 (ladder language)", "Team call transcript (10/5/2026): ladder securing method; Justin as competent person for ladder and lifts", "Internal pre-site-visit call notes (10/1/2026) §4 and action table", "SOW §I.5.H.i.4–5 (user training, ANSI Z359 harnesses)", "Emails: none found (Justin’s ladder remark is only in the 10/2 team chat)"]}, {"id": "B4", "text": "Decide the respirator policy explicitly: mandatory N-95 (requires medical exams + fit testing) vs. voluntary use under 4 hrs/day (requires neither).", "tags": ["Alex 1:50 PM, 1:58 PM"], "pg": ["pp.8,12,15,18,20,21,24,27,29,30,32,33,36"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Decided on the 10/5 call: voluntary respirator use. The conditions the team stated: work outdoors, under 4 hours per day for any one person, a grinder with a dust shroud and vacuum, no facial hair on the wearer, and N95s on hand. Lenny’s masonry crew is preferred for the chimney grinding. Under those conditions no medical evaluation or fit test is required (29 CFR 1910.134, external, verify). T0006 currently reads as mandatory use on pp.8, 12–36 (“N95+ respirator required,” p.20; “required per SDS guidance,” p.32). <strong>Action:<\/strong> Reword every PPE line to “available for voluntary use; Appendix D provided” and set p.8 to Option 3 with a one-line justification (or point it to the separate respiratory transmittal, see B7). The decision holds only while the conditions hold: if any worker will exceed 4 hours a day or work indoors, or the crew has beards, mandatory use applies.", "pill": "Resolved", "sources": ["T0006 pp.8, 12, 15, 18, 20, 21, 24, 27, 29, 30, 32, 33, 36", "Team call transcript (10/5/2026): respirator policy (voluntary use, conditions)", "Internal pre-site-visit call notes (10/1/2026) §6 (silica, respirator, 4 hrs/day)", "Safety data sheets: Firestone Jet-Bond spray adhesive; Quikrete C4 mortar", "29 CFR 1910.134(c)(1)–(2) and Appendix D (external, verify)"]}, {"id": "B5", "text": "Confirm whether a HEPA-shroud grinder will be used for chimney mortar grinding — ties into the respirator decision (silica exposure).", "tags": ["Alex 1:37 PM"], "pg": ["p.8", "p.20"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> The chimney work is first in sequence (SOW §II Part 3 ¶5: pressure wash, repoint with Type N mortar, siloxane sealer, all inspected before shingle demolition). T0006 p.20 says joints are “ground out,” so OSHA’s silica Table 1 for a handheld mortar-removal grinder applies: a commercial shroud, a dust collector with a 99%+ filter, and a HEPA vacuum for cleanup (external, verify). That Table 1 route still requires a written exposure control plan and a competent person. The team already owns a shroud but is unsure its shop vac takes a HEPA filter. <strong>Action:<\/strong> Write “shrouded grinder with HEPA-filtered dust collection per 29 CFR 1926.1153 Table 1” into p.20 and the p.8 Silica row, and produce the short written silica plan now rather than “before Phase 4” (Phase 4 is the first field work). Field task: confirm or buy a HEPA-capable collector before Wednesday. Hand tools are the only alternative and would need p.20 reworded.", "pill": "Resolved", "sources": ["SOW §II Part 3 ¶5 (chimney restoration, sequence)", "T0006 p.8 (Part 11 Silica row, Option 2); p.20 (Step 2)", "Internal pre-site-visit call notes (10/1/2026) §6", "29 CFR 1926.1153(c) Table 1 and (g) (external, verify)", "Email (different project): “Silica” thread, 8/19/2026 (Table 1 reminder, Real Art Ways)"]}, {"id": "B6", "text": "Confirm a licensed electrician will handle the rooftop ventilation/exhaust-fan electrical connection.", "tags": ["Alex 1:38 PM, 1:53 PM / Justin 1:53 PM"], "pg": ["pp.8,23,26,27"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Decided on the 10/5 call: delete “licensed electrician” and any electrician wording from T0006 (pp.8, 23, 26, 27). Travis said USACE’s on-site utilities electrician can disconnect and reconnect the HVAC unit, but called it a gray area for A1’s warranty and leaned toward A1 using its own electrician; Justin can make the simple reconnection as a last resort. Context for the record: the SOW does not say “licensed electrician,” but the Contractor is responsible for licenses and permits (§I.7) and the Government provides no equipment or services (§II Part 1 ¶3). A1’s 7/31 bid for the HVAC curb excluded refrigerant and electrical disconnection and reconnection, so the work was never in A1’s price. Massachusetts licensing rules are external; verify. <strong>Action:<\/strong> Edit pp.8, 23, 26 and 27 as decided. One risk to keep in view: the precon rule is that Travis hears about any deviation, so consider adding one line saying the USACE utilities electrician performs the disconnect and reconnect, and get Travis’s email confirming it. If Justin will make the connection himself, check Massachusetts licensing first.", "sources": ["SOW §II Part 2 ¶15–16; §I.7; §II Part 1 ¶3", "T0006 pp.8, 23, 26, 27", "Team call transcript (10/5/2026): electrician discussion", "A1 bid 7/31/2026 and email “Plywood Decking Options, HVAC Curb & Ventilation” (HVAC curb item excludes refrigerant and electrical disconnects)", "Precon meeting minutes ¶7.d (only the KO can change the contract)", "Team call transcript (10/5/2026): electrician decision"]}, {"id": "B7", "text": "Confirm with Brent/Justin whether to adapt the existing RAW written respiratory protection program for this site, or build a new one.", "tags": ["Alex 1:36 PM"], "pg": ["p.8", "p.10"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Decided on the 10/5 call: adapt the existing Real Art Ways respiratory plan for this site; Alex sends it over, and it goes into T0006 or is filed as its own transmittal. The ENG 6293 form lists a Respiratory Protection Program as a minimum plan, and T0006 p.8 gives no completion date and attaches nothing (Part 13 Appendix 5 is marked No). Under the voluntary-use decision in B4 the plan can stay short. <strong>Action:<\/strong> Alex sends the RAW plan; Gibs adapts it for USACE and decides attached versus separate transmittal. If attached, mark Appendix 5 “Yes” and make p.8 point to it; if separate, give p.8 its submission date.", "pill": "Resolved", "sources": ["ENG Form 6293 Part 11 (T0006 p.8); Part 13 (p.10)", "Team call transcript (10/5/2026): respiratory plan adapted from RAW", "SOW §I.5.B (APP accepted before on-site work); SOW §II Part 3 ¶5", "29 CFR 1910.134(c)(1) (external, verify)"]}, {"id": "B8", "text": "Confirm demolition debris is actually hand-lowered via scaffold hand lines (not thrown into dumpsters/chutes).", "tags": ["Alex 1:56–1:57 PM"], "pg": ["pp.23,29,32"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Decided on the 10/5 call: nothing is hand-lowered. Shingle tear-off slides down a tarp fixed at the eave onto the grass and is picked up; EPDM debris goes down a tarp system to a ground tarp (about 12 ft up, attached to the shingle roof). Dumpsters or trailers: at least two. The team accepts that Travis may kick it back. T0006 says “hand-lined” or “never thrown” on pp.7, 15, 17, 18, 29, 32, 35, 36, 52 and 55, and p.23 (shingle tear-off) never says how debris reaches the ground. Nothing in the SOW blocks this method (§I.2; §II Part 1 ¶8). <strong>Action:<\/strong> Replace every hand-line and “never thrown” sentence with the tarp-slide description and add it to Phase 5 (p.23). Add the canal protections in F8. Because this changes what T0006 previously committed to, give Travis a heads-up call before submitting. Keep T0006 identical to T0007.", "sources": ["SOW §I.2; §II Part 1 ¶7, ¶8; §II Part 1 ¶2.H; §II Part 3 ¶30", "T0006 pp.7, 15, 17, 18, 23, 29, 32, 35, 36, 52, 55", "Team call transcript (10/5/2026): tarp-slide debris system; dumpsters", "Internal pre-site-visit call notes (10/1/2026) §7 (dumpster, landfill)"]}]}, {"id": "C", "title": "C. Personnel & certificates", "owner": "Owner: Gibs + Alex", "sub": "", "items": [{"id": "C1", "text": "Remove the “no longer with the company / removed” language about Jeremy Tracy, Andre Rivera, and Jonathan O’Coin.", "tags": ["Alex 1:20 PM"], "pg": ["p.2"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> The exact text on p.2 (row 0006-L) reads that Jeremy Tracy and Andre Rivera are “no longer with the company and have been removed,” and Jonathan O’Coin was “previously removed for the same reason.” None of the three is a designated SSHO, Competent Person or on-site person in the APP, and no spec requirement calls for explaining their absence. Email does not support the statement either (see C2 and C3). <strong>Action:<\/strong> Replace it with a neutral roster line, for example: “24-Hour EM 385 Competent Person Fall Protection certificates (United Safety Professionals): E. O’Garro, A. Salvagno, J. Turner (02/27/2026); B. Van Brocklin, S. Audet, W. Trabal Figueroa (09/30/2026).”", "pill": "Resolved", "sources": ["T0006 p.2 (Attachment 0006-L row)", "SOW §I.5.D–H (roles that need documentation)", "Emails: no message says anyone left the company"]}, {"id": "C2", "text": "Confirm Jeremy Tracy’s current employment status — Alex believes he may still be with the company. Don’t drop his EM-385 cert if so.", "tags": ["Alex 1:21 PM"], "pg": ["p.2"], "kind": "ok", "pill": "Resolved", "finding": "<strong>Analysis:<\/strong> Resolved by the 10/5 call: Jeremy is still with the company. The team said to leave him on the EM 385 list, he holds a current 385, and he is the backup who goes to site if Justin is pulled out (Jason also stays listed, though he probably will not go). T0006 does not designate him for any other role, so the “no longer with the company” sentence (C1) is simply wrong. <strong>Action:<\/strong> Delete the C1 sentence. Keep Jeremy (and Jason) on the roster as backups, with their certificates.", "sources": ["T0006 pp.2, 5", "Email: “Re: Ft. Buchanan – New Transmittals…,” 6/21/2026 (certificate count mentions Jeremy Tracy)", "Email: “FCC Start Up & Groton Supplies,” 4/8/2026 (reply from his A1 address)", "Team call transcript (10/5/2026): Jeremy and Jason kept on the EM 385 list; Jeremy as backup SSHO"]}, {"id": "C3", "text": "Confirm the actual status of Andre Rivera and Jonathan O’Coin — verify whether they were really removed or the characterization at page 2 is simply wrong.", "tags": ["Alex 2:06 PM"], "pg": ["p.2"], "kind": "ok", "pill": "Resolved", "finding": "<strong>Analysis:<\/strong> Resolved by the 10/5 call. Jonathan O’Coin is still with the company: he was present at the office that day and was asked why he chose the lifeline system, so “removed” on p.2 is wrong. Andre Rivera was not described as gone, but the call said to take him off the EM 385 list, which is a roster decision rather than a departure. <strong>Action:<\/strong> Delete the C1 sentence. Remove Andre from the EM 385 list; do not describe either person as removed.", "sources": ["T0006 p.2", "Precon meeting minutes (05 Feb 2026) roster", "Internal pre-site-visit call notes (10/1/2026), referenced-people list", "Emails: Real Art Ways threads, 6/9–8/19/2026 (last activity only; no departure stated)", "Team call transcript (10/5/2026): O’Coin present and consulted; Andre removed from the 385 list"]}, {"id": "C4", "text": "On-file EM-385 certs confirmed; missing Jeremy (Tracy) and Jason Spencer — Alex’s take is these aren’t required since neither is going, but worth keeping as future backups.", "tags": ["Alex 2:06–2:09 PM"], "pg": ["pp.2,39,42,45,47,49,50"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> The certificate roster still meets the SOW minimum: 24-Hour EM 385 Competent Person cards for Earl O’Garro, Alex Salvagno and Justin Turner (02/27/2026, p.49) and Brent Van Brocklin, Stephen Audet and Wilson Trabal Figueroa (09/30/2026, p.50). The 10/5 call changes who must be listed. Take Andre and Zak off the EM 385 list (Zak does not hold it); leave Jeremy and Jason on as backups; remove Brent as scaffold competent person (no scaffold evidence, and scaffolding is out); name Justin as competent person for the ladder and lifts (Brent holds no equipment-operation card). Both Justin and Brent must be on site for the whole job, because Travis will shut the job down if the only SSHO leaves. First Aid/CPR cards exist only for Earl, Alex, Justin and Brent (pp.39, 42, 45, 47). <strong>Action:<\/strong> Edit the roster on pp.2, 5, 39–50 to match, keep Justin and Brent on site every shift (a dump run by one is fine only while the other stays; Jeremy covers if Justin is pulled), and add any chimney or Lenny crew members before they work. Still to do: Zak’s signature blocks on the AHAs need checking against the “Zak holds no EM 385” point.", "sources": ["T0006 pp.2, 5, 39, 42, 45, 47, 49, 50", "Team call transcript (10/5/2026): EM 385 list, competent persons, SSHO coverage", "SOW §I.5.E, §I.5.F, §I.5.H.i.1 and i.4", "Internal pre-site-visit call notes (10/1/2026) (CP coverage; chimney crew)", "Emails: none list EM-385 holders (only “EM 385 class starts today,” 9/28)"]}, {"id": "C5", "text": "Add the missing signatures — the document is missing wet/digital signatures in multiple places.", "tags": ["Alex 2:06 PM"], "pg": ["pp.1,3,4,12,15,18,21,24,27,30,33,36,38,57"], "kind": "flag", "finding": "<strong>Analysis:<\/strong> Unsigned blocks are unchanged: p.1 contractor signature and date; p.3 Part 1; p.38 ENG 6282; the Zachary Ziegler block on each of the nine AHAs (pp.12–36); and both lines on p.57. Two earlier issues remain: p.38 has Level 2 SSHO selected where SOW §I.5.D requires Level 3, and the Corporate Safety Official is named inconsistently (Alex on pp.2–3, Brent on pp.4 and 38). New: the 10/5 call rewrites the fall-protection method, access, debris and roster, so signing now would sign pages that are about to change. <strong>Action:<\/strong> Finish the T0006 revisions first, then pick one Corporate Safety Official, select Level 3 on p.38, sign every block, and clear the pre-filled dates (D7).", "pill": "Open", "sources": ["T0006 pp.1, 2, 3, 4, 12–36, 38, 49, 57 (blocks verified on rendered pages)", "SOW §I.5.D (Level 3 SSHO)", "Team call transcript (10/5/2026): T0006 revisions still pending", "Email: “Transmittals 0005, 0007, 0008 ready for submission,” 10/2/2026 (T0006 still being reworked)"]}]}, {"id": "D", "title": "D. Document corrections", "owner": "Owner: Gibs — once A & B are resolved", "sub": "", "items": [{"id": "D1", "text": "APP Part 2, Item 3 (Estimated Project Start Date): currently 02/04/2026 — stale/past. Change to the real calendar date for “next Tuesday.”", "tags": ["Alex 1:24 PM"], "pg": ["p.3 Part 2 Items 3–4"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Resolved by the 10/5 call. 02/04/2026 is the Notice to Proceed date (precon minutes ¶2.b), not an on-site start. The call sets the physical start: the lift drop Tuesday or Wednesday (Travis accepted an unattended drop), and the whole crew mobilizes Wednesday 10/07/2026, 7:00–8:00 AM, to set the lift and trailer, stage materials and install the D-rings. Completion shows 11/02/2026 (270 days from NTP); the call put the current completion date at about November 6 and concluded an extension request is needed (see F11). <strong>Action:<\/strong> Enter 10/07/2026 as the estimated project start date on p.3 Item 3, and match T0007, which still says October 5. Give Travis a heads-up call on the change (precon minutes ¶10) and confirm the completion date after the modification.", "pill": "Resolved", "sources": ["T0006 p.3 (Part 2 Items 3–4); AHA notes boxes pp.11–35", "Precon meeting minutes (05 Feb 2026) ¶2.b–c, ¶10; SOW §I.4", "Internal pre-site-visit call notes (10/1/2026) §8 (schedule)", "Email: “Transmittals 0001–0010, reordered materials-first,” 9/23/2026 (“October 5 start”)", "Alex’s 8/28/2026 email to Travis (projected start Monday Oct 5), as cited in the spec review", "Team call transcript (10/5/2026): Wednesday mobilization"]}, {"id": "D2", "text": "APP Part 2, Item 5 (Line 5) scope description: strip warranty-years/wind-speed references; fix the shingle sq ft; add HVAC curb replacement; drop “full” from gutter/fascia/soffit unless confirmed.", "tags": ["Alex 1:27 PM"], "pg": ["p.3 Line 5"], "kind": "flag", "finding": "<strong>Analysis:<\/strong> The earlier version of this item was wrong: it said the HVAC curb had no contract basis. It does. The revised SOW in the 7/24/2026 RFP adds replacing the rooftop HVAC condenser steel curb with a pressure-treated wood curb at least 18 in. high, and raises plywood deck replacement from 10% to 25%. A1’s 7/31 bid priced both: decking (an additional 15%, about 1,200 sq ft) at $23,500, and the curb (lump sum, unit lowered and re-attached, refrigerant and electrical disconnects excluded) at $5,000. The rest of the p.3 problems stand: (1) “Owens Corning Platinum Preferred” is A1’s contractor tier, not a shingle; the submitted shingle is Duration FLEX. (2) The warranty and wind-speed parentheticals belong in the product transmittals, and the EPDM 120 MPH figure is contested (the assembly letter supports only 90 MPH). (3) “Full” gutter/fascia/soffit is too strong: Contract Q&A Response 9 excludes locations where existing aluminum gutters remain. <strong>Action:<\/strong> Replace the sentence with: “Replacement of the asphalt shingle roof (including up to 25% plywood deck replacement) and the EPDM flat roof of the Administration Building, including replacement of the rooftop HVAC condenser curb with a pressure-treated wood curb, chimney restoration (2), removal and reinstallation of the lightning protection system, replacement of exhaust fans (3) and fresh-air intakes (2), and replacement of fascia, soffit, trim and aluminum gutters.” Drop “full” and the parentheticals. Ask Zak to confirm the modification is executed and which SOW revision governs.", "pill": "Open", "sources": ["Revised SOW in RFP 26-PA-012, 7/24/2026 (plywood deck 10% → 25%; HVAC condenser curb, pressure-treated wood, minimum 18 in.)", "A1 bid schedule, 7/31/2026 (item 1 decking $23,500; item 2 HVAC curb $5,000)", "Email “26-P-A012 Admin Roof - Follow-Up – Plywood Decking Options, HVAC Curb & Ventilation” (curb scope and exclusions)", "SOW §I.1 (scope description); Contract Q&A Response 9 (gutter locations)", "T0006 p.3 Line 5; Transmittal 0001 (shingle product)", "Emails: Eastern AR assembly-letter thread, 9/9/2026; “USACE Cape Cod Canal Project” (Mule-Hide), 9/30/2026"]}, {"id": "D3", "text": "Attach the full subcontractor/supplier list as Appendix 2 — currently referenced in the text but not included — or remove the reference.", "tags": ["Alex 1:29 PM, 2:12 PM"], "pg": ["p.4 Item 8", "p.10"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> A contradiction confirmed on the rendered pages: Part 4 Item 8 (p.4) says the subcontractor and supplier list is in Appendix 2 (Yes), but Part 13 (p.10) marks Appendix 2 as No. Part 4 Item 9 already allows the list to be updated and resubmitted before any work starts, so attaching a list now is permitted. From the documents the subcontractors are Free Hill Capital and Sparta Construction (precon minutes ¶3.c; T0006 p.10 and the AHAs). Still unconfirmed: the chimney crew, the electrician (B6), the lightning-protection contractor (SOW §II Part 3 ¶6 requires a qualified UL-listed LPS contractor), and major suppliers. <strong>Action:<\/strong> Attach Appendix 2 listing Free Hill Capital and Sparta Construction with contacts, mark p.10 Appendix 2 “Yes,” keep p.4 Item 8 “Yes,” and add others as they are confirmed.", "pill": "Resolved", "sources": ["T0006 pp.4 (Part 4 Items 8–9), 10 (Parts 12–13), 12", "Precon meeting minutes ¶3.c", "SOW §II Part 3 ¶6 (LPS contractor)", "Emails: Sparta Construction threads, 9/29–10/1/2026 (Sparta still in the loop; no final subcontractor list)"]}, {"id": "D4", "text": "Attach the project map as Appendix 1 — currently referenced but not included — or remove the reference.", "tags": ["Alex 2:12 PM"], "pg": ["p.3 Part 2 Item 2", "p.10"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Confirmed: p.3 says “attach map in Appendix 1” and p.10 marks Appendix 1 as No. The SOW itself does not require a map; the requirement comes from the form. Material for a map is available: the aerial diagrams in the sketch report, the west-side flat grassed area for storage and dumpsters (SOW §II Part 1 ¶7), the staging and assembly point named on pp.6 and 11, and the hospital route on pp.11 and 55. Note that p.55 names Cape Cod Hospital in Hyannis as the nearest hospital; check whether a closer one serves Buzzards Bay before it goes on the map. <strong>Action:<\/strong> Build a one-page marked-up aerial (building, staging/laydown, contaminated-area boundary, assembly point, hospital route), attach it as Appendix 1, and mark Part 13 Appendix 1 “Yes.”", "pill": "Resolved", "sources": ["T0006 p.3 (Part 2 Item 2); p.10 (Part 13); pp.6, 11, 55", "Aerial sketch report, 40 Academy Drive (10/27/25), diagram pages", "SOW §II Part 1 ¶7 (storage and dumpster area)", "Emails: none found"]}, {"id": "D5", "text": "Remove page 44 — a stale notice that Alex’s temporary OSHA-30 card expires in 90 days. His permanent card is already included elsewhere.", "tags": ["Alex 2:11 PM"], "pg": ["p.41", "p.44", "p.46"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Confirmed, with two additions. Page 44 is the temporary-card notice (valid 90 days) that follows Alex’s OSHA-30 completion certificate on p.43, and p.41 is the same kind of notice for Earl. Both show personal home addresses. ENG 6282 and APP Part 5 Item 2 require OSHA-30 proof only for the designated SSHOs, and Earl and Alex are not designated. New finding: the form accepts a completion certificate only if within 90 days, and Justin Turner’s certificate (04/02/2026, p.46) is 185 days old, so it is outside the window. Brent’s (09/16/2026) is fine. <strong>Action:<\/strong> Remove pp.41 and 44 and update the p.2 page counts for 0006-E and 0006-G (2 becomes 1). Add Justin’s official DOL OSHA-30 card (or a replacement) to Attachment 0006-I.", "pill": "Resolved", "sources": ["T0006 pp.41, 43, 44, 46, 48; p.2 (attachment page counts)", "ENG Form 6282 and APP Part 5 Item 2 (T0006 pp.5, 38; 90-day certificate rule)", "Emails: none found"]}, {"id": "D6", "text": "Update the Written Fall Protection Program’s date — currently March 9, 2026, which predates Brent’s employment.", "tags": ["Alex 2:09 PM"], "pg": ["p.51", "p.54", "p.57"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> Confirmed: the memo header on p.51 reads “March 9, 2026” and the signature dates on p.57 read 03/09/2026. The demonstrable defect is that the memo (p.54 §6.4) cites a “03/31/2026 site walkthrough,” so a document dated March 9 refers to a later event. The earlier explanation (date predates Brent’s employment) is not supported by the files. Two content gaps found too: p.53 sends “inspection, storage, care, and maintenance” to §9, but §9 (p.56) covers inspection only, and p.53 says protection is needed at “four feet or more” and also “6 ft or greater”; the SOW uses 6 ft. <strong>Action:<\/strong> Re-date the memo and signatures to the actual sign date. Add two sentences on storage and maintenance to §9, reconcile the 4 ft / 6 ft sentence, and keep the p.57 signature table on the same page as the last section.", "pill": "Resolved", "sources": ["SOW §I.5.H (fall protection and prevention plan; EM 385 21-7 items i.1–7)", "T0006 pp.51, 53, 54, 56, 57", "Emails: none found"]}, {"id": "D7", "text": "Audit every signature block in T0006 — all dated 03/09/26. Correct every one to an accurate, current date before resubmission.", "tags": ["Alex 1:53 PM"], "pg": ["pp.11–38", "p.51", "p.57"], "kind": "ok", "finding": "<strong>Analysis:<\/strong> There are 23 stale “03/09/2026” dates, not 12: the date field on each of the nine AHA headers (pp.11, 14, 17, 20, 23, 26, 29, 32, 35); the Approval Authority date on each AHA (pp.12, 15, 18, 21, 24, 27, 30, 33, 36); both dates on the SSHO letter (p.38); the fall-protection memo (p.51); and both signature dates on p.57. They are wrong on their face because the documents cite a 03/31/2026 walkthrough and include certificates dated 09/2026. <strong>Action:<\/strong> Set all 23 to the real sign date, or leave a date blank where a signer fills it in. Correct them together with the walkthrough date (F4).", "pill": "Resolved", "sources": ["T0006 pp.11–38, 51, 57 (date fields counted by page)", "T0006 pp.2, 48, 50 (certificates dated 09/2026)", "Emails: none found"]}, {"id": "D8", "text": "Correct the APP’s EM-385 training answer once A2 is resolved.", "tags": ["Alex 1:32 PM"], "pg": ["p.5"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> Part 5 Item 1 (p.5) says all employees will be trained per EM 385-1-1 and applicable requirements before work starts, with Yes checked. That matches the SOW, which requires training, not certification, for general employees; OSHA-30 and designation letters are limited to SSHOs in Item 2. <strong>Action:<\/strong> Leave the “Yes” as is.", "sources": ["T0006 p.5 (Part 5 Items 1–2)", "SOW §I.5.D–H", "Emails: none found"]}, {"id": "D9", "text": "New — align the Required Appendices checklist (Part 13) with what’s actually attached.", "tags": [], "pg": ["p.8", "p.9", "p.10"], "kind": "flag", "finding": "<strong>Analysis:<\/strong> Part 13 (p.10) marks all six appendices No. Appendix 3 (qualifications and designations: Attachments 0006-D through 0006-L, plus the p.38 letter) and Appendix 4 (AHAs: Attachment 0006-B) are in the package and should be Yes; Appendix 5 can be Yes for the Written Fall Protection Program only; Appendices 1 and 2 stay No until built (D4, D3). Part 11 (pp.8–9) marks many plans “Option 1 — attached” and points to an “APP Sec. N” narrative that is not in the package. The 10/5 call widens this: the scaffold work plan row no longer applies, the respiratory plan may be a separate transmittal (B7), the logistics plan (F10) is a new attachment, and Steve’s fall-protection statement will change the Written Fall Protection Program. <strong>Action:<\/strong> After the revisions, redo Part 11 and Part 13 in one pass: mark Appendices 3 and 4 “Yes,” set the scaffold row to not applicable, add the logistics plan and the respiratory plan, and either assemble the missing narrative plans or re-mark those rows Option 2 or 3 with dates and justifications (a human decision).", "pill": "Open", "sources": ["T0006 p.10 (Part 13); pp.8–9 (Part 11); pp.2, 11–37, 38", "ENG Form 6293 Part 10 Item 11 and Part 11 option rules", "Team call transcript (10/5/2026): scaffold removed, respiratory plan, logistics plan", "Emails: none found"]}]}, {"id": "E", "title": "E. Final production", "owner": "Owner: Gibs", "sub": "E2 is ready to execute on sign day; the rest wait on the open items above.", "items": [{"id": "E1", "text": "Roll every confirmed change from Sections B, C, and D into the T0006 document.", "tags": [], "pg": [], "kind": "flag", "pill": "Open", "finding": "<strong>Analysis:<\/strong> Blocked until the open items are decided: C5 (signatures), D2 (scope sentence), D9 (appendices), F1 (radar), F4 (walkthrough date), F7 (25% decking), F9 (prevailing wage), F11 (dates and completion), and E3/E4 (QC and submission). Everything the 10/5 call decided (access, ladders, electrician, roster, fall protection, lift, canal protection, logistics, start date) and the earlier resolved items can be rolled into T0006 now. <strong>Action:<\/strong> Collect the remaining decisions in one pass, then edit T0006 once so every page, date and appendix reference changes together.", "sources": ["Items in Sections A–D and F of this page", "Team call transcript (10/5/2026)", "Email: “Transmittals 0005, 0007, 0008 ready for submission,” 10/2/2026 (T0006 reworked after “no open items” on 9/23)"]}, {"id": "E2", "text": "Add today’s date to the transmittal cover (page 1) and apply Zak’s eSignature at the bottom — same treatment already used on T0005 / T0007 / T0008.", "tags": [], "pg": [], "kind": "ok", "pill": "Resolved", "finding": "<strong>Analysis:<\/strong> No document or email blocks this. T0005, T0007 and T0008 were dated and signed on 10/2 using the image-overlay eSignature method, and the same treatment applies to the T0006 cover (page 1 contractor signature and date are currently blank). The date to enter is the day the final package is signed. <strong>Action:<\/strong> On sign day, add the date to the cover and apply Zak’s eSignature at the bottom of page 1, plus the nine AHA approval blocks (C5).", "sources": ["T0006 p.1 (cover)", "Email: “Transmittals 0005, 0007, 0008 ready for submission,” 10/2/2026", "SOW §II Part 1 ¶2; precon minutes ¶6.a"]}, {"id": "E3", "text": "Full re-QC pass: re-check every flagged page (1, 2, 3, 4, 8, 10, 32, 38, 44, 51, plus pp.12–36 signature dates) to confirm the final text has no contradictions and matches what the team agreed to.", "tags": [], "pg": [], "kind": "flag", "pill": "Open", "finding": "<strong>Analysis:<\/strong> Cannot be finished until the edits above are made. When it runs, re-check every changed page (1, 2, 3, 4, 5, 8, 9, 10, 20, 23, 29, 32, 38, 41, 44, 51, 53, 55, 57), the 23 date fields, and the form editions: T0006 uses ENG 6293 (AUG 2024), 6206 (SEP 2024) and 6282 (AUG 2024), while the SOW links name the 2023 editions; the forms state older editions are obsolete, so the newer ones are fine. <strong>Action:<\/strong> After the final edits, run a full read-through and a rendered-page check of every signature block and checkbox.", "sources": ["T0006 (all 57 pages)", "SOW §I.5 (form references)", "Items A–D and F of this page"]}, {"id": "E4", "text": "Submit T0006 — the 10/5 call set submission for today (Monday).", "tags": [], "pg": [], "kind": "flag", "pill": "Open", "finding": "<strong>Analysis:<\/strong> The contract sets no review period and no copy count: submittals go by email on ENG Form 4025 with a QC certification statement. Work cannot start until the Government accepts the APP, AHAs and fall-protection plan (SOW §I.5.B, §I.5.H, §II Part 1 ¶2; precon ¶4.a and ¶6.b). On the 10/5 call Brent was told to finish T0006 with the missing appendices and submit it today, with crew mobilization planned for Wednesday 7:00–8:00 AM, which leaves about two days for review. Nothing obliges the Government to turn it around, and T0006 now contains several deviations (D-rings, lift, tarp-slide debris, electrician). <strong>Action:<\/strong> Call Travis before submitting, request expedited review, and ask for written acceptance (action code A or B on the 4025) before any field work, including the lift setup and D-ring installation on Wednesday. If acceptance has not arrived, do not put the crew on the roof.", "sources": ["SOW §I.5.B, §I.5.H, §II Part 1 ¶2; Quotation Instruction 6", "Precon meeting minutes ¶4.a, ¶6.a–b", "ENG Form 4025 instructions", "Team call transcript (10/5/2026): submit today; mobilize Wednesday", "Email: “Transmittals 0005, 0007, 0008 ready for submission,” 10/2/2026"]}]}, {"id": "F", "title": "F. New findings from this review", "owner": "Owner: Gibs", "sub": "Issues the spec and email review turned up that were not on the original list, plus items added after the 10/5 team call (F5–F11). Each is rated the same way: green when the documents settle it, amber when someone must decide.", "items": [{"id": "F1", "text": "Radar “10-ft shutdown” language: find its source or remove it from the APP and AHAs.", "tags": ["Review finding"], "pg": ["pp.8,11,17"], "kind": "flag", "pill": "Open", "finding": "<strong>Analysis:<\/strong> T0006 says radar shutdown is required only when work is within 10 ft of the radar array and names Geoffrey Steuerwald as the contact (pp.8, 11, 17 and others). It has no source in the SOW, solicitation, proposal, precon minutes or any email. On the 10/5 call the team said the facility contact, named “David,” told them they have full access to shut the radar off at any time and that a backup system exists. The radar is on the EPDM side, which is also the crew’s access route, so in practice it may need to be off whenever they are on the roof. The name and the 10-ft rule do not match what the call described. <strong>Action:<\/strong> Confirm with Travis in writing: who the radar contact is (T0006 says Geoffrey, the call says David), whether the 10-ft rule is real, and what distance or procedure applies. Then either keep the rule with its source or replace it with the actual protocol on pp.8, 11 and 17 and in the AHAs.", "sources": ["T0006 pp.8, 10, 11, 17", "Team call transcript (10/5/2026): radar shutdown, “David,” backup system", "Email: “Chimney Scope, Sequencing & Radar Coordination,” 10/1/2026 (write-up body; attachment not readable here)", "SOW and Precon minutes: no matching text found"]}, {"id": "F2", "text": "Accident notification time: T0006 says 24 hours, but the precon minutes say 4 hours.", "tags": ["Review finding"], "pg": ["p.5", "pp.55,56"], "kind": "ok", "pill": "Resolved", "finding": "<strong>Analysis:<\/strong> Precon minutes ¶4.a require notifying Travis “no later than 4 hours” after any accident. T0006 Part 7 (p.5) and pp.55–56 say 24 hours for non-fatal accidents and near misses. SOW §I.5.G adds EM 385 Table 2-1 reporting and ENG Form 3394 within 7 days. The strictest requirement governs. <strong>Action:<\/strong> Change p.5 and pp.55–56 to 4 hours for notifying the TPOC, and keep the 7-day ENG 3394 reference.", "sources": ["Precon meeting minutes (05 Feb 2026) ¶4.a", "SOW §I.5.G", "T0006 p.5 (Part 7), pp.55–56"]}, {"id": "F3", "text": "Part 11 housekeeping: stale “before NTP” commitments, missing dates, and tool statements that contradict the work.", "tags": ["Review finding"], "pg": ["pp.8,9,20,27"], "kind": "ok", "pill": "Resolved", "finding": "<strong>Analysis:<\/strong> Several Part 11 rows promise things “before NTP” (AED, grounding program, sanitation), but NTP was 02/04/2026. The Option 2 rows (respiratory, thermal stress, silica, AED, grounding, sanitation) give no expected date, which the form requires. Hearing Conservation says “hand tools only” (Option 3), yet T0006 lists a pneumatic nailer and compressor (p.27), a pressure washer and a grinder (p.20). p.9 says no welding or cutting, while the SOW allows soldered copper flashing joints (§II Part 2 ¶13). <strong>Action:<\/strong> Replace “before NTP” with real dates, add an expected date to every Option 2 row, correct the hearing-conservation statement, and add hot-work coverage if copper flashing will be soldered.", "sources": ["T0006 pp.8, 9, 20, 27", "ENG Form 6293 Part 11 option rules", "SOW §II Part 2 ¶13", "Precon meeting minutes ¶2.b (NTP date)"]}, {"id": "F4", "text": "Site walkthrough date: T0006 cites 03/31/2026, but the visit may have been 03/30/2026.", "tags": ["Review finding"], "pg": ["pp.11,12,14,17,18,20,26,29,54"], "kind": "flag", "pill": "Open", "finding": "<strong>Analysis:<\/strong> T0006 cites a “03/31/2026 site walkthrough” about a dozen times. The spec review found March 2026 emails scheduling the rescheduled visit for March 30 at 12:30 PM, but no file confirms March 31, and I could not re-find those emails in this mailbox pass. Treat the date as unverified. <strong>Action:<\/strong> Ask Alex which day the walkthrough happened, then correct every occurrence at the same time as the D7 dates.", "sources": ["T0006 pp.11, 12, 14, 17, 18, 20, 26, 29, 54", "Spec review of March 2026 scheduling emails (not re-confirmed in this pass)"]}, {"id": "F5", "text": "Fall protection switches from horizontal lifelines to D-ring sets, ropes and harnesses.", "tags": ["Team call 10/5"], "pg": ["pp.2,5,7,11,15,17,18,20,23,24,26,27,35,36,53,54,56"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> The 10/5 call switched the whole job from the dual horizontal lifelines to D-ring sets with ropes and harnesses, on the shingle and the flat roofs. Reasons given: D-rings set up faster, a lifeline holds only two workers (four tied off with two lines), and the lifeline was O’Coin’s choice for ease and did not come from Travis. Wilson’s crew owns fall protection under its subcontract but has only partial equipment; the purchase of D-rings and rope was put at about $800. T0006 describes lifelines on 17 pages and in the Written Fall Protection Program, including “two independent horizontal anchor/lifeline systems per straight run (5,000 lb rated each)” and the maximum-workers-per-line rules. Steve must send a written statement of what Wilson’s crew will actually use. <strong>Action:<\/strong> Still to do: rewrite the fall-protection method everywhere lifelines appear. Name the anchor type, rating and installation method, the rope or rope-grab setup, the rescue method and who inspects the equipment. Remove the lifeline system and per-line worker limits and update the AHA hazard rows and the Written Fall Protection Program to match. Hold signatures until Steve’s statement arrives; Travis’s replacement will enforce exactly what is submitted.", "sources": ["Team call transcript (10/5/2026): fall-protection decision and reasons", "T0006 pp.2, 5, 7, 11, 15, 17, 18, 20, 23, 24, 26, 27, 35, 36, 53, 54, 56 (lifeline wording)", "SOW §I.5.H (fall-protection plan accepted before work; ANSI Z359 harnesses)", "Precon meeting minutes (Travis must always be aware; heads-up call on any deviation)"]}, {"id": "F6", "text": "Scissor lift: T0006 says no powered lifting equipment, but a 32-ft all-terrain scissor lift is coming.", "tags": ["Team call 10/5"], "pg": ["pp.7–9,12,14,15,17,18,51,52"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> A 32-ft all-terrain scissor lift is arriving because no 26-ft unit was available. It is dropped Tuesday (Travis said an unattended drop is fine) or delivered Wednesday between 7 and 8 AM. About 10 ground-protection mats go under it and along its path on the grass; it will be mostly stationary at the side of the building; and the crew stays off the sidewalk because Travis says the foundation is cracking. Justin is the competent person for the lift; Brent holds no equipment-operation card, and Wilson’s man (“PD”) may hold a lift certification that nobody has confirmed. T0006 has no lift AHA and states that no machinery or powered lifting equipment is permitted on 10 pages. The SOW has no outrigger or lift language, says the Government provides no equipment (§II Part 1 ¶3), puts the staging area on the west grass with restoration at contractor expense (§II Part 1 ¶7), and requires disturbed grass to be repaired (§II Part 3 ¶30). <strong>Action:<\/strong> Still to do: strike the “no machinery” statements and add an equipment AHA covering operator qualification, daily inspection, ground-bearing and sidewalk protection, travel path and fall protection while in the basket. Get the rental company’s machine weight and any outrigger or ground-pressure requirements for the 32-ft unit, and confirm the operator’s certification before first use. Include delivery and staging in T0006 and T0007.", "sources": ["Team call transcript (10/5/2026): lift type, delivery, mats, sidewalk, operator", "T0006 pp.7–9, 12, 14, 15, 17, 18, 51, 52 (no machinery / powered lifting wording)", "SOW §II Part 1 ¶3, ¶7; §II Part 3 ¶30", "Internal pre-site-visit call notes (10/1/2026) §4 (lift rental)"]}, {"id": "F7", "text": "Plywood decking replacement is 25% in the revised SOW; T0006 still says a 10% allowance.", "tags": ["Team call 10/5"], "pg": ["pp.7,17,23,24,26,27"], "pill": "Open", "kind": "flag", "finding": "<strong>Analysis:<\/strong> The revised SOW in the 7/24/2026 RFP raises plywood deck replacement from 10% to 25% (APA-rated exterior plywood matching the existing thickness and grade). A1’s 7/31 bid priced the additional 15%, about 1,200 sq ft, at $23,500, which is roughly 38 sheets of 4×8 plywood. T0006 pp.23 and 24 state “CONTRACT ALLOWANCE: 10% deck replacement included” and a trigger to notify the Government if the 10% allowance is at risk. The call also left open whether plywood goes on the truck or is bought on the Cape. <strong>Action:<\/strong> Change T0006 to 25% and reset the notification trigger; confirm with Zak that the modification is executed and which SOW revision governs; fix the plywood quantity and source in the materials list.", "sources": ["Revised SOW in RFP 26-PA-012, 7/24/2026 (plywood roof decking, 25%)", "A1 bid schedule, 7/31/2026 (item 1, additional 15%, about 1,200 sq ft, $23,500)", "T0006 pp.7, 17, 23, 24, 26, 27", "Team call transcript (10/5/2026): plywood on the truck vs. buy locally"]}, {"id": "F8", "text": "Canal protection and debris containment are not in T0006.", "tags": ["Team call 10/5"], "pg": ["pp.1,2,3,10,11,14,17,18,20,23,26,29,32,35,38,51,53–55"], "pill": "Resolved", "kind": "ok", "finding": "<strong>Analysis:<\/strong> The call set the canal-protection measures: orange barrier fence along the water’s edge, a person watching, and magnet sweeps for nails. The team’s own point: this is a USACE navigation project, synthetic underlayment blowing into the canal is the fastest way to get shut down, and a fence will not stop loose debris coming off a sloped roof. T0006 mentions the canal on 19 pages but has no debris-containment plan for shingle tear-off. <strong>Action:<\/strong> Still to do: add a canal-protection section: fence location, a named watcher each shift, a daily magnet sweep, no loose underlayment or synthetic material left on the roof in wind, and the tarp system from B8. State that the fence is supplemental to the watcher.", "sources": ["Team call transcript (10/5/2026): canal protection, debris, magnet sweep", "T0006 pp.1, 2, 3, 10, 11, 14, 17, 18, 20, 23, 26, 29, 32, 35, 38, 51, 53–55 (canal references)", "SOW §I.2; §II Part 1 ¶8 (debris and rubbish)"]}, {"id": "F9", "text": "Lenny’s crew: wage rates, roster and subcontractor list.", "tags": ["Team call 10/5"], "pg": ["p.2", "p.5", "Appendix 2"], "pill": "Open", "kind": "flag", "finding": "<strong>Analysis:<\/strong> Lenny’s masonry crew may come for the chimney, fascia and gutters. On the call, one worker billed through Lenny’s company was put at about $30/hr and described as “not the prevailing” rate. The contract includes FAR 52.222-6 (Construction Wage Rate) and Wage Determination MA20250001, so prevailing-wage and certified-payroll rules apply to every worker on site, including subcontractor employees. The crew will also need rooms, and its members are not on the roster or the Appendix 2 subcontractor list. <strong>Action:<\/strong> Before Lenny’s crew starts: check each worker’s classification and rate against the wage determination, add Lenny’s company and workers to Appendix 2 (D3) and the roster (C4), and sort out the certified-payroll responsibility with Wilson’s side (Connor’s payroll role was raised).", "sources": ["Team call transcript (10/5/2026): Lenny’s crew, rates, rooms", "Contract W912WJ26PA012: FAR 52.222-6 and Wage Determination MA20250001", "T0006 pp.2, 5 (roster); Appendix 2 (D3)"]}, {"id": "F10", "text": "Logistics plan: staging, dumpsters, lift location, hospital route, landfill, porta-potty.", "tags": ["Team call 10/5"], "pg": /* ================= Helpers ================= */
function $(sel, root){ return (root || document).querySelector(sel); }
function el(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++){
    [].concat(arguments[i]).forEach(function(c){
      if (c === null || c === undefined || c === false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmt(ts){
  try { return new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(new Date(ts)); }
  catch(e){ return ts || ''; }
}
function clip(s){ s = String(s || ''); return s.length > 120 ? s.slice(0, 120) + '…' : s; }

var TOKEN = '';            /* this browser's private id; lets you edit/delete your own entries */
try { TOKEN = localStorage.getItem('t0006-token') || ''; } catch(e){}
if (!TOKEN){
  var arr = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(arr);
  TOKEN = Array.prototype.map.call(arr, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  try { localStorage.setItem('t0006-token', TOKEN); } catch(e){}
}

function autosize(t){ t.style.height = 'auto'; t.style.height = Math.max(44, t.scrollHeight + 2) + 'px'; }

      el('span', {class:'grp-label'}, 'Answers/Comments/Feedback'),

  wirePlaceholder(nameIn); wirePlaceholder(textIn);

  nameIn.addEventListener('input', function(){ err.textContent = ''; });
  btn.addEventListener('click', function(){ onMain(itemId, grp); });
  del.addEventListener('click', function(){ onDeleteButton(itemId, grp); });

/* Reflect state + permissions on one group's buttons and fields. */
function applyMode(grp){
  var st = grp.dataset.state, rec = grp._rec;
  var n = $('.f-name', grp), t = $('.f-text', grp), btn = $('.btn-main', grp), del = $('.btn-del', grp);
  var locked = st === 'locked';
  n.readOnly = locked; t.readOnly = locked;
  if (st === 'draft'){
    n.disabled = readOnly; t.disabled = readOnly;
    btn.hidden = readOnly; btn.textContent = 'Save';
    del.hidden = readOnly; del.textContent = 'Discard';
  } else {
    n.disabled = false; t.disabled = false;
    var mine = canModify(rec);
    btn.hidden = !mine; btn.textContent = locked ? 'Edit' : 'Save';
    del.hidden = !mine; del.textContent = 'Delete';
  }
  btn.setAttribute('aria-label', btn.textContent + ' response');
  del.setAttribute('aria-label', del.textContent + ' response');
  $('.confirm', grp).hidden = true;
}
function setState(grp, st){ grp.dataset.state = st; applyMode(grp); }

function fillLocked(grp, r){
  grp._rec = r; grp.dataset.gid = r.id;
  var n = $('.f-name', grp), t = $('.f-text', grp);
  n.value = r.name || ''; t.value = r.text || ''; n.placeholder = ''; t.placeholder = '';
  setState(grp, 'locked');
  var edited = r.updatedAt && r.createdAt && r.updatedAt !== r.createdAt;
  $('.grp-meta', grp).textContent = (edited ? 'Edited by ' : 'Saved by ') + (r.name || 'Unknown') + ' · ' + fmt(r.updatedAt || r.createdAt);
  $('.grp-err', grp).textContent = '';
  autosize(t);
}

function showErr(grp, msg){ $('.grp-err', grp).textContent = msg; }

/* ================= Server calls ================= */
function headers(){
  var h = {'content-type':'application/json', 'x-client-token':TOKEN};
  return h;
}
async function api(method, body){
  var res = await fetch(API, {method:method, headers:headers(), body: body ? JSON.stringify(body) : undefined, cache:'no-store'});
  var data = null; try { data = await res.json(); } catch(e){}
  if (!res.ok){ var err = new Error('http ' + res.status); err.code = (data && data.error) || String(res.status); throw err; }
  return data;
}

/* ================= Actions ================= */
async function onMain(itemId, grp){
  if (readOnly) return;
  var st = grp.dataset.state;
  var n = $('.f-name', grp), t = $('.f-text', grp);
  if (st === 'locked'){
    setState(grp, 'editing');
    $('.grp-meta', grp).textContent = 'Editing — tap Save when done.';
    t.focus(); var len = t.value.length; try { t.setSelectionRange(len, len); } catch(e){}
    return;
  }
  var name = n.value.trim(), text = t.value.trim();
  if (!name || !text){
    showErr(grp, !name && !text ? 'Please enter your name and a response before saving.' : (!name ? 'Please enter your name before saving.' : 'Please enter a response before saving.'));
    (!name ? n : t).focus();
    return;
  }
  var gid = grp.dataset.gid, old = gid ? recs[gid] : null;
  if (old && old.name === name && old.text === text){ fillLocked(grp, old); return; }
  var btn = $('.btn-main', grp);
  btn.disabled = true; grp._busy = true;
  var isNew = !old;
  if (isNew && !gid){ gid = newId(); grp.dataset.gid = gid; }
  try {
    var out = await api('POST', {action:'save', id:gid, item:itemId, name:name, text:text});
    recs[gid] = out.record;
    lastWriteDone = Date.now();
    fillLocked(grp, out.record);
    updateStatus();
    toast(isNew ? 'Saved and shared with everyone.' : 'Changes saved and shared.');
    poll();
  } catch(e){
    if (isNew) delete grp.dataset.gid;
    showErr(grp, e.code === 'forbidden' ? 'Only the person who wrote this entry can change it.' :
      'Could not save. Check your connection and try again.');
  } finally { btn.disabled = false; grp._busy = false; }
}

function onDeleteButton(itemId, grp){
  var st = grp.dataset.state;
  if (st === 'draft'){            /* nothing saved yet: just discard the draft */
    $('.f-name', grp).value = ''; $('.f-text', grp).value = '';
    $('.f-name', grp).placeholder = 'Name'; $('.f-text', grp).placeholder = 'Answer/Comment/Feedback';
    autosize($('.f-text', grp)); showErr(grp, '');
    var cont = containers[itemId];
    if (cont.children.length > 1) cont.removeChild(grp);
    return;
  }
  $('.confirm', grp).hidden = false;
  $('.btn-danger', grp).focus();
}

async function doDelete(itemId, grp){
  var gid = grp.dataset.gid;
  var yes = $('.btn-danger', grp); yes.disabled = true; grp._busy = true;
  try {
    await api('POST', {action:'delete', id:gid});
    delete recs[gid];
    lastWriteDone = Date.now();
    removeGroup(itemId, grp);
    updateStatus();
    toast('Entry deleted for everyone.');
    poll();
  } catch(e){
    $('.confirm', grp).hidden = true;
    showErr(grp, e.code === 'forbidden' ? 'Only the person who wrote this entry can delete it.' :
      'Could not delete. Check your connection and try again.');
  } finally { yes.disabled = false; grp._busy = false; }
}

function removeGroup(itemId, grp){
  var cont = containers[itemId];
  if (grp.parentNode === cont) cont.removeChild(grp);
  if (!cont.children.length) cont.appendChild(makeGroup(itemId, null));
}

/* ================= Live sync ================= */
function syncDom(){
  var byItem = {};
  Object.keys(recs).forEach(function(id){ var r = recs[id]; (byItem[r.item] = byItem[r.item] || []).push(r); });
  SECTIONS.forEach(function(sec){ sec.items.forEach(function(it){
    var cont = containers[it.id];
    var list = (byItem[it.id] || []).sort(function(a, b){ return String(a.createdAt).localeCompare(String(b.createdAt)); });
    var present = {};
    list.forEach(function(r){
      present[r.id] = true;
      var g = cont.querySelector('[data-gid="' + r.id + '"]');
      if (!g){
        g = makeGroup(it.id, r);
        var firstDraft = [].slice.call(cont.children).filter(function(c){ return !c.dataset.gid; })[0];
        cont.insertBefore(g, firstDraft || null);
      } else if (g.dataset.state === 'locked' && !g._busy){
        fillLocked(g, r);
      } else { g._rec = r; }
    });
    [].slice.call(cont.children).forEach(function(g){
      var gid = g.dataset.gid;
      if (!gid || present[gid] || g._busy) return;
      if (g.dataset.state === 'editing'){
        delete g.dataset.gid; g._rec = null; g.dataset.state = 'draft'; applyMode(g);
        showErr(g, 'This entry was deleted by someone else. Saving will add it back.');
      } else cont.removeChild(g);
    });
    /* drop leftover empty drafts when real entries exist; keep one blank draft otherwise */
    if (!cont.children.length) cont.appendChild(makeGroup(it.id, null));
  }); });
}

}

  hist.forEach(function(h){
    histList.appendChild(el('li', {class:'hist-row'},
      el('div', {class:'hist-top'},
        el('span', {class:'hist-act' + (h.action === 'Deleted' ? ' del' : '')}, h.action + (h.item ? ' · ' + h.item : '')),
        el('time', {datetime:h.ts}, fmt(h.ts))),
      h.name ? el('div', {class:'hist-who'}, (h.action === 'Deleted' ? 'Entry by ' : '') + h.name) : null,
      h.snippet ? el('div', {class:'hist-snip'}, '“' + h.snippet + '”') : null));
  });
}
function openHistory(){ renderHistory(); openDlg(histDlg); }

/* ================= Polling ================= */
function applyData(data){
  recs = {};
  data.responses.forEach(function(r){ recs[r.id] = r; });
  hist = data.history || [];
  live = true; offline = false;
  syncDom(); updateStatus(); refreshModes();
  if (histDlg.open) renderHistory();
}
var polling = false;
async function poll(){
  if (polling) return; polling = true;
  var started = Date.now();
  try {
    var data = await api('GET');
    if (lastWriteDone <= started) { applyData(data); showBanner(''); }
  } catch(e){
    offline = true; updateStatus();
    if (!live) showBanner('Could not reach the server. The page will keep retrying. If this persists, the site’s function may not be deployed yet.');
  } finally { polling = false; }
}

build();
updateStatus();
poll();
setInterval(function(){ if (!document.hidden) poll(); }, 5000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });
window.addEventListener('focus', poll);
window.addEventListener('beforeunload', function(e){
  var dirty = $$all('.grp[data-state="draft"], .grp[data-state="editing"]').some(function(g){ return $('.f-name', g).value.trim() || $('.f-text', g).value.trim(); });
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});

})();
</script>
