<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>T0006 Resolution Plan</title>
<style>

  /* Layout: single column of item cards (max 960px); each card carries its own live response groups. */
  :root{
    --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f0ede6; --border:#ddd7cb; --border-strong:#c9c1b1;
    --ink:#2a251d; --dim:#6b6253; --accent:#8a5a2b; --accent-ink:#ffffff;
    --warn-bg:#fbeee0; --warn-border:#d9a86c; --warn-ink:#6b3e10;
    --done-bg:#e9f0e6; --done-border:#a9c79c; --done-ink:#3c5c33;
    --field-bg:#ffffff; --field-locked:#f0ede6; --ph:#7a7468; --danger:#a3321f; --live:#3c8a3c; --idle:#8a8374;
    --shadow:0 1px 2px rgba(40,30,10,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1812; --surface:#242019; --surface-2:#2c2720; --border:#3c352a; --border-strong:#51483a;
      --ink:#ede7da; --dim:#aca290; --accent:#d59a5c; --accent-ink:#1b1812;
      --warn-bg:#352515; --warn-border:#7a4e22; --warn-ink:#e8bd84;
      --done-bg:#1f2a1c; --done-border:#3d5635; --done-ink:#9fc48f;
      --field-bg:#1b1812; --field-locked:#2c2720; --ph:#9a917f; --danger:#ef8a77; --live:#6cc06c; --idle:#8a8374;
      --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
      --bg:#1b1812; --surface:#242019; --surface-2:#2c2720; --border:#3c352a; --border-strong:#51483a;
      --ink:#ede7da; --dim:#aca290; --accent:#d59a5c; --accent-ink:#1b1812;
      --warn-bg:#352515; --warn-border:#7a4e22; --warn-ink:#e8bd84;
      --done-bg:#1f2a1c; --done-border:#3d5635; --done-ink:#9fc48f;
      --field-bg:#1b1812; --field-locked:#2c2720; --ph:#9a917f; --danger:#ef8a77; --live:#6cc06c; --idle:#8a8374;
      --shadow:none; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    padding:0 16px 40px;
  }
  .wrap{max-width:960px; margin:0 auto; padding-top:24px}
  h1,h2{font-family:Georgia,"Times New Roman",serif; font-weight:600; text-wrap:balance}
  h1{font-size:clamp(1.35rem,4.5vw,1.8rem); margin:0 0 6px; line-height:1.2}
  h2{font-size:1.15rem; margin:0}
  p{margin:0}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .subtitle{color:var(--dim); font-size:.93rem; margin-bottom:14px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .chip{font-size:.78rem; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:3px 9px}

  .actions{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px}
  .btn{
    appearance:none; cursor:pointer; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:8px; padding:8px 14px; font-size:.88rem; font-weight:600; min-height:40px;
  }
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn-primary:hover{background:var(--accent); filter:brightness(1.08)}
  .statusline{font-size:.82rem; color:var(--dim); display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; margin-bottom:6px}
  .sync{display:inline-flex; align-items:center; gap:6px; font-weight:600}
  .sync::before{content:""; width:9px; height:9px; border-radius:50%; background:#3c8a3c}
  .sync.dirty::before{background:#d08a1a}

  details.howto{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:14px 0 6px; font-size:.9rem}
  details.howto summary{cursor:pointer; font-weight:600}
  details.howto ol{margin:8px 0 0; padding-left:20px}
  details.howto li{margin:3px 0}

  nav.jump{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px}
  nav.jump a{
    text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:5px 12px; font-size:.82rem; font-weight:600; min-height:32px; display:inline-flex; align-items:center;
  }
  nav.jump a:hover{background:var(--surface-2)}

  .callout{background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink); border-radius:10px; padding:14px 16px; margin:18px 0 8px; font-size:.93rem}
  .callout strong{display:block; font-family:Georgia,serif; margin-bottom:4px}

  section.sec{margin-top:30px; scroll-margin-top:12px}
  .sec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; margin-bottom:4px}
  .owner{font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:2px 10px; background:var(--surface-2); border:1px solid var(--border); color:var(--dim)}
  .sec-sub{color:var(--dim); font-size:.86rem; margin-bottom:12px}

  .items{display:flex; flex-direction:column; gap:14px}
  article.item{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
  .item-head{display:flex; gap:10px; align-items:flex-start}
  .num{
    flex:none; min-width:2.4rem; text-align:center; font-weight:700; font-size:.82rem; color:var(--accent-ink);
    background:var(--accent); border-radius:6px; padding:2px 6px; margin-top:2px;
  }
  .item-text{font-size:.96rem; flex:1; min-width:0}
  .pill{
    flex:none; font-size:.66rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
    color:var(--done-ink); background:var(--done-bg); border:1px solid var(--done-border); border-radius:999px; padding:2px 9px; margin-top:3px;
  }
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0 calc(2.4rem + 10px)}
  .tag{font-size:.72rem; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 7px}
  .tag.pg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .finding{margin:10px 0 0; border-radius:8px; padding:9px 12px; font-size:.86rem; line-height:1.45; border:1px solid var(--border); background:var(--surface-2)}
  .finding.ok{background:var(--done-bg); border-color:var(--done-border); color:var(--done-ink)}
  .finding.flag{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-ink)}
  .finding code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8rem; background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px}
  .finding .src{display:block; margin-top:5px; font-size:.75rem; opacity:.85; font-style:italic}

  .resp{margin-top:14px; border-top:1px dashed var(--border-strong); padding-top:12px}
  .groups{display:flex; flex-direction:column; gap:12px}
  .grp{border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface-2)}
  .grp[data-state="editing"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .grp-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 10px; margin-bottom:8px}
  .grp-label{font-size:.8rem; font-weight:700; letter-spacing:.02em; color:var(--dim)}
  .btn-mini{
    appearance:none; cursor:pointer; border:1px solid var(--border-strong); background:var(--surface); border-radius:6px;
    padding:3px 12px; font-size:.78rem; font-weight:700; min-height:30px; line-height:1.2;
  }
  .btn-mini:hover{background:var(--surface-2)}
  .grp[data-state="draft"] .btn-mini, .grp[data-state="editing"] .btn-mini{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  @media (pointer:coarse){ .btn-mini{min-height:38px; padding:5px 16px} }

  .grp-fields{display:grid; grid-template-columns:1fr; gap:8px}
  @media (min-width:640px){ .grp-fields{grid-template-columns:minmax(150px,220px) 1fr} }
  .grp input, .grp textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--field-bg);
    border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px; display:block; margin:0;
  }
  .grp textarea{min-height:44px; resize:vertical; overflow:hidden; line-height:1.4}
  .grp input::placeholder, .grp textarea::placeholder{color:var(--ph); font-style:italic; opacity:1}
  .grp[data-state="locked"] input, .grp[data-state="locked"] textarea{background:var(--field-locked); cursor:default}
  .grp-meta{font-size:.74rem; color:var(--dim); margin-top:6px}
  .grp-err{font-size:.8rem; color:var(--danger); margin-top:6px; font-weight:600}
  .grp-err:empty{display:none}

  .add{
    appearance:none; cursor:pointer; margin-top:12px; background:transparent; border:1px dashed var(--border-strong);
    border-radius:8px; padding:8px 14px; font-size:.85rem; font-weight:600; color:var(--accent); min-height:40px;
  }
  .add:hover{background:var(--surface-2)}

  footer{margin-top:40px; padding-top:14px; border-top:1px solid var(--border); color:var(--dim); font-size:.78rem}

  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30;
    background:#2a251d; color:#fff; padding:9px 16px; border-radius:8px; font-size:.86rem; max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1}

  dialog{
    border:1px solid var(--border-strong); border-radius:14px; padding:0; width:min(640px,calc(100vw - 24px)); max-height:85vh;
    background:var(--surface); color:var(--ink);
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface)}
  .dlg-body{padding:6px 18px 18px; overflow:auto; max-height:calc(85vh - 64px)}
  .dlg-note{font-size:.8rem; color:var(--dim); margin:10px 0}
  ul.hist{list-style:none; margin:0; padding:0}
  .hist-row{padding:10px 0; border-bottom:1px solid var(--border)}
  .hist-top{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-size:.84rem}
  .hist-act.del{color:var(--danger)}
  .hist-act{font-weight:600}
  .hist-top time{color:var(--dim); font-size:.78rem}
  .hist-who{font-size:.84rem; color:var(--dim)}
  .hist-snip{font-size:.84rem; font-style:italic; margin-top:2px; overflow-wrap:anywhere}
  .empty{color:var(--dim); padding:14px 0}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap}
  noscript p{padding:20px; background:var(--warn-bg); color:var(--warn-ink)}

  .sync{color:var(--dim)}
  .sync::before{background:var(--idle)!important}
  .sync.on::before{background:var(--live)!important}
  .banner{background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink); border-radius:10px; padding:10px 14px; margin:0 0 12px; font-size:.9rem}
  .grp-btns{display:inline-flex; gap:6px; flex-wrap:nowrap; justify-content:flex-end; margin-left:auto}
  .btn-main:disabled,.btn-danger:disabled{opacity:.6; cursor:wait}
  .btn-del{color:var(--danger); border-color:var(--danger); background:transparent}
  .btn-del:hover{background:var(--surface)}
  .btn-danger{background:var(--danger)!important; border-color:var(--danger)!important; color:#fff!important}
  .confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:0 0 8px; padding:8px 10px; border:1px solid var(--danger); border-radius:8px; background:var(--field-bg); font-size:.86rem; font-weight:600}
  .confirm[hidden]{display:none}
  .grp input:disabled,.grp textarea:disabled{opacity:.7; cursor:not-allowed}
  .add:disabled{opacity:.5; cursor:not-allowed}



  .pill.open{color:var(--warn-ink); background:var(--warn-bg); border-color:var(--warn-border)}
  .finding{padding:10px 13px}
  .finding-body{font-size:.88rem; line-height:1.5}
  .finding.ok .finding-body strong:first-child, .finding.flag .finding-body strong:first-child{text-transform:uppercase; letter-spacing:.04em; font-size:.72rem}
  .sources{margin-top:9px; padding-top:8px; border-top:1px solid currentColor; border-top-color:color-mix(in srgb, currentColor 30%, transparent); font-size:.78rem; line-height:1.45}
  .sources strong{text-transform:uppercase; letter-spacing:.05em; font-size:.68rem}
  .sources ul{margin:4px 0 0; padding-left:18px}
  .sources li{margin:2px 0; overflow-wrap:anywhere}
  .chip-done{background:var(--done-bg); border-color:var(--done-border); color:var(--done-ink)}
  .chip-open{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-ink)}
  .legend{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:.82rem; color:var(--dim); margin:0 0 12px}
  .sw{display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--border-strong)}
  .sw-done{background:var(--done-bg); border-color:var(--done-border)}
  .tags{min-width:0}
  .tag{max-width:100%; overflow-wrap:anywhere}
  .tag.pg{white-space:normal}
  .sw-open{background:var(--warn-bg); border-color:var(--warn-border); margin-left:8px}
</style>
</head>

Confirm the 7/24 contract modification is executed and which SOW revision governs.", "tags": ["Zak"], "pg": [], "pill": "Open", "kind": "flag", "finding": "Affects the 25% decking and the HVAC curb scope.", "sources": []}]}, {"id": "B", "title": "B. Safety items before the first cut", "owner": "Owner: Justin / Brent / Steve", "sub": "Respirators, silica controls and fall protection details that must be settled before work starts.", "items": [{"id": "B21", "text": "Team agreement on the respirator approach.", "tags": ["Team"], "pg": ["p.8"], "pill": "Open", "kind": "flag", "finding": "The call chose voluntary use. T0006 treats chimney grinding as required-use because 29 CFR 1926.1153 Table 1 item (xi) requires it.", "sources": []}, {"id": "B22", "text": "Medical evaluations and fit tests for grinder operators before the first cut.", "tags": ["Justin"], "pg": [], "pill": "Open", "kind": "flag", "finding": "Or switch to hand tools. The roster’s clinic and physician lines are blank.", "sources": []}, {"id": "B23", "text": "Silica equipment details.", "tags": ["Justin"], "pg": [], "pill": "Open", "kind": "flag", "finding": "Grinder make/model and wheel diameter, airflow, dust collector, filter efficiency, HEPA vacuum, and the counterflashing path (A, B or C).", "sources": []}, {"id": "B24", "text": "Steve’s written statement of the fall protection equipment Wilson’s crew will use.", "tags": ["Steve"], "pg": [], "pill": "Open", "kind": "flag", "finding": "Wilson’s crew owns fall protection under its subcontract and has only partial equipment.", "sources": []}, {"id": "B25", "text": "D-ring anchor type, installation method, rope model and number of anchor sets.", "tags": ["Brent"], "pg": [], "pill": "Open", "kind": "flag", "finding": "Blank in the Written Fall Protection Program; a few AHA blanks (pinch points, anchor attachment points) also remain.", "sources": []}, {"id": "B26", "text": "Written plans marked “expected 10/07/2026.”", "tags": ["Brent"], "pg": [], "pill": " /* ================= Helpers ================= */
function $(sel, root){ return (root || document).querySelector(sel); }
function el(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++){
    [].concat(arguments[i]).forEach(function(c){
      if (c === null || c === undefined || c === false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmt(ts){
  try { return new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(new Date(ts)); }
  catch(e){ return ts || ''; }
}
function clip(s){ s = String(s || ''); return s.length > 120 ? s.slice(0, 120) + '…' : s; }

/* ================= Shared state (kept on the server, fetched every few seconds) ================= */
var API = '/api';
var TOKEN = '';            /* this browser's private id; lets you edit/delete your own entries */
try { TOKEN = localStorage.getItem('t0006-token') || ''; } catch(e){}
if (!TOKEN){
  var arr = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(arr);
  TOKEN = Array.prototype.map.call(arr, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  try { localStorage.setItem('t0006-token', TOKEN); } catch(e){}
}
var readOnly = false;
var live = false, offline = false;
var lastWriteDone = 0;
var recs = {};            /* responses by id */
var hist = [];            /* newest 100 history rows */
var containers = {};      /* item id -> .groups element */
var statusEl, liveEl, banner, toastEl, histDlg, histList;

var nDone = 0, nOpen = 0;
SECTIONS.forEach(function(s){ s.items.forEach(function(it){ if (it.kind === 'flag') nOpen++; else nDone++; }); });

function canModify(r){
  if (readOnly || !r) return false;
  return !!r.mine;
}

  wrap.appendChild(el('div', {class:'chips'},
    el('span', {class:'chip'}, 'Mobilization: Wed 10/7, 7:00–8:00 AM'),
    el('span', {class:'chip chip-open'}, nOpen + ' open items')));
  banner = el('p', {class:'banner', role:'status', hidden:true});
  wrap.appendChild(banner);

  statusEl = el('span', null, 'Loading responses…');
  liveEl = el('span', {class:'sync', role:'status'}, 'Connecting');
  wrap.appendChild(el('div', {class:'statusline'}, statusEl, liveEl));
  wrap.appendChild(el('div', {class:'actions'},
    el('button', {class:'btn', type:'button', id:'btn-history', onclick:openHistory}, 'Version history')));

  wrap.appendChild(el('details', {class:'howto', open:true},
    el('summary', null, 'How this form works'),
    el('ol', null,
      el('li', null, 'Type your name and your answer, comment, or feedback under the line item, then tap Save. The entry locks so it can’t be changed by accident.'),
      el('li', null, 'Need to change something? Tap Edit, make your change, and tap Save again. Tap Delete to remove your entry.'),
      el('li', null, 'Need to add more than one response to an item? Tap “+ Add Answer/Comment/Feedback”.'),
      el('li', null, 'Everything is shared. Entries, edits, and deletions made by anyone appear on everyone’s screen within a few seconds, with no file to send back and nothing to refresh.'),
      el('li', null, 'You can edit or delete the entries you created on this device and browser. “Version history” lists the latest edits and who made them.'))));

  var nav = el('nav', {class:'jump', 'aria-label':'Jump to section'});
  SECTIONS.forEach(function(s){ nav.appendChild(el('a', {href:'#sec-' + s.id}, s.title.replace(/^([A-F])\..*/, 'Section $1'))); });
  wrap.appendChild(nav);

  wrap.appendChild(el('div', {class:'callout'},
    el('strong', null, 'Why this matters'),
    'The package is built and signed. No field work, including the lift setup and D-ring installation, starts until Travis accepts the APP, AHAs and fall protection plan. The items below are what is left to close.'));

  SECTIONS.forEach(function(sec){
    var s = el('section', {class:'sec', id:'sec-' + sec.id},
      el('div', {class:'sec-head'}, el('h2', null, sec.title), el('span', {class:'owner'}, sec.owner)),
      sec.sub ? el('p', {class:'sec-sub'}, sec.sub) : null);
    var list = el('div', {class:'items'});
    sec.items.forEach(function(it){ list.appendChild(buildItem(it)); });
    s.appendChild(list);
    wrap.appendChild(s);
  });
  wrap.appendChild(el('footer', null, 'Responses are stored in this page’s shared database and shown to everyone who opens it. Version history lists the latest 100 edits.'));
  app.appendChild(wrap);

  toastEl = el('div', {class:'toast', role:'status', 'aria-live':'polite'});
  app.appendChild(toastEl);

  histList = el('ul', {class:'hist'});
  histDlg = el('dialog', {'aria-labelledby':'hist-title'},
    el('div', {class:'dlg-head'},
      el('h2', {id:'hist-title'}, 'Version history'),
      el('button', {class:'btn', type:'button', onclick:function(){ closeDlg(histDlg); }}, 'Close')),
    el('div', {class:'dlg-body'},
      el('p', {class:'dlg-note'}, 'The most recent edits made to this document, newest first.'),
      histList));
  app.appendChild(histDlg);
}

function buildItem(it){
  var head = el('div', {class:'item-head'},
    el('span', {class:'num'}, it.id),
    el('p', {class:'item-text', html:it.text}),
    it.pill ? el('span', {class:'pill ' + (it.kind === 'flag' ? 'open' : 'done')}, it.pill) : null);
  var art = el('article', {class:'item', id:'item-' + it.id, 'data-item':it.id}, head);
  var tags = (it.tags || []).map(function(t){ return el('span', {class:'tag'}, t); })
    .concat((it.pg || []).map(function(p){ return el('span', {class:'tag pg'}, p); }));
  if (tags.length) art.appendChild(el('div', {class:'tags'}, tags));
  if (it.finding) {
    var fbox = el('div', {class:'finding ' + (it.kind || '')}, el('div', {class:'finding-body', html:it.finding}));
    if (it.sources && it.sources.length) {
      fbox.appendChild(el('div', {class:'sources'},
        el('strong', null, 'Sources'),
        el('ul', null, it.sources.map(function(s){ return el('li', null, s); }))));
    }
    art.appendChild(fbox);
  }

  var groups = el('div', {class:'groups'});
  containers[it.id] = groups;
  var addBtn = el('button', {class:'add', type:'button', onclick:function(){
    var g = makeGroup(it.id, null); groups.appendChild(g); autosize($('.f-text', g)); $('.f-name', g).focus();
  }}, '+ Add Answer/Comment/Feedback');
  art.appendChild(el('div', {class:'resp'}, groups, addBtn));
  groups.appendChild(makeGroup(it.id, null));
  return art;
}

function autosize(t){ t.style.height = 'auto'; t.style.height = Math.max(44, t.scrollHeight + 2) + 'px'; }
function wirePlaceholder(inp){
  inp.addEventListener('focus', function(){ inp.placeholder = ''; });
  inp.addEventListener('blur', function(){ if (!inp.value) inp.placeholder = inp.dataset.ph; });
}

function makeGroup(itemId, rec){
  var nameIn = el('input', {type:'text', class:'f-name', placeholder:'Name', 'data-ph':'Name', 'aria-label':'Name (' + itemId + ')', autocomplete:'off', maxlength:'80'});
  var textIn = el('textarea', {class:'f-text', rows:'1', placeholder:'Answer/Comment/Feedback', 'data-ph':'Answer/Comment/Feedback', 'aria-label':'Answer, comment or feedback (' + itemId + ')', maxlength:'4000'});
  var btn = el('button', {class:'btn-mini btn-main', type:'button'}, 'Save');
  var del = el('button', {class:'btn-mini btn-del', type:'button', hidden:true}, 'Delete');
  var meta = el('div', {class:'grp-meta'});
  var err = el('p', {class:'grp-err', role:'alert'});
  var yes = el('button', {class:'btn-mini btn-danger', type:'button'}, 'Yes, delete');
  var no = el('button', {class:'btn-mini', type:'button'}, 'Keep it');
  var ask = el('div', {class:'confirm', hidden:true, role:'alertdialog'},
    el('span', null, 'Delete this entry for everyone?'), yes, no);
  var grp = el('div', {class:'grp', 'data-state':'draft'},
    el('div', {class:'grp-head'},
      el('span', {class:'grp-label'}, 'Answers/Comments/Feedback'),
      el('span', {class:'grp-btns'}, btn, del)),
    el('div', {class:'grp-fields'}, nameIn, textIn), ask, meta, err);
  wirePlaceholder(nameIn); wirePlaceholder(textIn);
  textIn.addEventListener('input', function(){ autosize(textIn); err.textContent = ''; });
  nameIn.addEventListener('input', function(){ err.textContent = ''; });
  btn.addEventListener('click', function(){ onMain(itemId, grp); });
  del.addEventListener('click', function(){ onDeleteButton(itemId, grp); });
  yes.addEventListener('click', function(){ doDelete(itemId, grp); });
  no.addEventListener('click', function(){ ask.hidden = true; });
  if (rec) fillLocked(grp, rec);
  else applyMode(grp);
  return grp;
}

/* Reflect state + permissions on one group's buttons and fields. */
function applyMode(grp){
  var st = grp.dataset.state, rec = grp._rec;
  var n = $('.f-name', grp), t = $('.f-text', grp), btn = $('.btn-main', grp), del = $('.btn-del', grp);
  var locked = st === 'locked';
  n.readOnly = locked; t.readOnly = locked;
  if (st === 'draft'){
    n.disabled = readOnly; t.disabled = readOnly;
    btn.hidden = readOnly; btn.textContent = 'Save';
    del.hidden = readOnly; del.textContent = 'Discard';
  } else {
    n.disabled = false; t.disabled = false;
    var mine = canModify(rec);
    btn.hidden = !mine; btn.textContent = locked ? 'Edit' : 'Save';
    del.hidden = !mine; del.textContent = 'Delete';
  }
  btn.setAttribute('aria-label', btn.textContent + ' response');
  del.setAttribute('aria-label', del.textContent + ' response');
  $('.confirm', grp).hidden = true;
}
function setState(grp, st){ grp.dataset.state = st; applyMode(grp); }

function fillLocked(grp, r){
  grp._rec = r; grp.dataset.gid = r.id;
  var n = $('.f-name', grp), t = $('.f-text', grp);
  n.value = r.name || ''; t.value = r.text || ''; n.placeholder = ''; t.placeholder = '';
  setState(grp, 'locked');
  var edited = r.updatedAt && r.createdAt && r.updatedAt !== r.createdAt;
  $('.grp-meta', grp).textContent = (edited ? 'Edited by ' : 'Saved by ') + (r.name || 'Unknown') + ' · ' + fmt(r.updatedAt || r.createdAt);
  $('.grp-err', grp).textContent = '';
  autosize(t);
}

function showErr(grp, msg){ $('.grp-err', grp).textContent = msg; }

/* ================= Server calls ================= */
function headers(){
  var h = {'content-type':'application/json', 'x-client-token':TOKEN};
  return h;
}
async function api(method, body){
  var res = await fetch(API, {method:method, headers:headers(), body: body ? JSON.stringify(body) : undefined, cache:'no-store'});
  var data = null; try { data = await res.json(); } catch(e){}
  if (!res.ok){ var err = new Error('http ' + res.status); err.code = (data && data.error) || String(res.status); throw err; }
  return data;
}

/* ================= Actions ================= */
async function onMain(itemId, grp){
  if (readOnly) return;
  var st = grp.dataset.state;
  var n = $('.f-name', grp), t = $('.f-text', grp);
  if (st === 'locked'){
    setState(grp, 'editing');
    $('.grp-meta', grp).textContent = 'Editing — tap Save when done.';
    t.focus(); var len = t.value.length; try { t.setSelectionRange(len, len); } catch(e){}
    return;
  }
  var name = n.value.trim(), text = t.value.trim();
  if (!name || !text){
    showErr(grp, !name && !text ? 'Please enter your name and a response before saving.' : (!name ? 'Please enter your name before saving.' : 'Please enter a response before saving.'));
    (!name ? n : t).focus();
    return;
  }
  var gid = grp.dataset.gid, old = gid ? recs[gid] : null;
  if (old && old.name === name && old.text === text){ fillLocked(grp, old); return; }
  var btn = $('.btn-main', grp);
  btn.disabled = true; grp._busy = true;
  var isNew = !old;
  if (isNew && !gid){ gid = newId(); grp.dataset.gid = gid; }
  try {
    var out = await api('POST', {action:'save', id:gid, item:itemId, name:name, text:text});
    recs[gid] = out.record;
    lastWriteDone = Date.now();
    fillLocked(grp, out.record);
    updateStatus();
    toast(isNew ? 'Saved and shared with everyone.' : 'Changes saved and shared.');
    poll();
  } catch(e){
    if (isNew) delete grp.dataset.gid;
    showErr(grp, e.code === 'forbidden' ? 'Only the person who wrote this entry can change it.' :
      'Could not save. Check your connection and try again.');
  } finally { btn.disabled = false; grp._busy = false; }
}

function onDeleteButton(itemId, grp){
  var st = grp.dataset.state;
  if (st === 'draft'){            /* nothing saved yet: just discard the draft */
    $('.f-name', grp).value = ''; $('.f-text', grp).value = '';
    $('.f-name', grp).placeholder = 'Name'; $('.f-text', grp).placeholder = 'Answer/Comment/Feedback';
    autosize($('.f-text', grp)); showErr(grp, '');
    var cont = containers[itemId];
    if (cont.children.length > 1) cont.removeChild(grp);
    return;
  }
  $('.confirm', grp).hidden = false;
  $('.btn-danger', grp).focus();
}

async function doDelete(itemId, grp){
  var gid = grp.dataset.gid;
  var yes = $('.btn-danger', grp); yes.disabled = true; grp._busy = true;
  try {
    await api('POST', {action:'delete', id:gid});
    delete recs[gid];
    lastWriteDone = Date.now();
    removeGroup(itemId, grp);
    updateStatus();
    toast('Entry deleted for everyone.');
    poll();
  } catch(e){
    $('.confirm', grp).hidden = true;
    showErr(grp, e.code === 'forbidden' ? 'Only the person who wrote this entry can delete it.' :
      'Could not delete. Check your connection and try again.');
  } finally { yes.disabled = false; grp._busy = false; }
}

function removeGroup(itemId, grp){
  var cont = containers[itemId];
  if (grp.parentNode === cont) cont.removeChild(grp);
  if (!cont.children.length) cont.appendChild(makeGroup(itemId, null));
}

/* ================= Live sync ================= */
function syncDom(){
  var byItem = {};
  Object.keys(recs).forEach(function(id){ var r = recs[id]; (byItem[r.item] = byItem[r.item] || []).push(r); });
  SECTIONS.forEach(function(sec){ sec.items.forEach(function(it){
    var cont = containers[it.id];
    var list = (byItem[it.id] || []).sort(function(a, b){ return String(a.createdAt).localeCompare(String(b.createdAt)); });
    var present = {};
    list.forEach(function(r){
      present[r.id] = true;
      var g = cont.querySelector('[data-gid="' + r.id + '"]');
      if (!g){
        g = makeGroup(it.id, r);
        var firstDraft = [].slice.call(cont.children).filter(function(c){ return !c.dataset.gid; })[0];
        cont.insertBefore(g, firstDraft || null);
      } else if (g.dataset.state === 'locked' && !g._busy){
        fillLocked(g, r);
      } else { g._rec = r; }
    });
    [].slice.call(cont.children).forEach(function(g){
      var gid = g.dataset.gid;
      if (!gid || present[gid] || g._busy) return;
      if (g.dataset.state === 'editing'){
        delete g.dataset.gid; g._rec = null; g.dataset.state = 'draft'; applyMode(g);
        showErr(g, 'This entry was deleted by someone else. Saving will add it back.');
      } else cont.removeChild(g);
    });
    /* drop leftover empty drafts when real entries exist; keep one blank draft otherwise */
    if (!cont.children.length) cont.appendChild(makeGroup(it.id, null));
  }); });
}

function refreshModes(){
  Object.keys(containers).forEach(function(id){
    [].slice.call(containers[id].children).forEach(applyMode);
  });
  $$all('.add').forEach(function(b){ b.disabled = readOnly; });
}
function $$all(sel){ return [].slice.call(document.querySelectorAll(sel)); }

function updateStatus(){
  var answered = {};
  Object.keys(recs).forEach(function(id){ if (containers[recs[id].item]) answered[recs[id].item] = true; });
  var n = Object.keys(answered).length;
  var last = hist[0];
  statusEl.textContent = (live ? n + ' of ' + totalItems + ' items have responses' : 'Loading responses…') +
    (last ? ' · Last edit: ' + (last.name ? last.name + ', ' : '') + fmt(last.ts) : '');
  liveEl.textContent = offline ? 'Offline — retrying' : (live ? 'Live' : 'Connecting');
  liveEl.classList.toggle('on', live && !offline);
}

function showBanner(msg){ banner.textContent = msg; banner.hidden = !msg; }

/* ================= History dialog / toast ================= */
var toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2800);
}
function openDlg(d){ if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', ''); }
function closeDlg(d){ if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }
function renderHistory(){
  histList.innerHTML = '';
  if (!hist.length) histList.appendChild(el('li', {class:'empty'}, 'No edits yet.'));
  hist.forEach(function(h){
    histList.appendChild(el('li', {class:'hist-row'},
      el('div', {class:'hist-top'},
        el('span', {class:'hist-act' + (h.action === 'Deleted' ? ' del' : '')}, h.action + (h.item ? ' · ' + h.item : '')),
        el('time', {datetime:h.ts}, fmt(h.ts))),
      h.name ? el('div', {class:'hist-who'}, (h.action === 'Deleted' ? 'Entry by ' : '') + h.name) : null,
      h.snippet ? el('div', {class:'hist-snip'}, '“' + h.snippet + '”') : null));
  });
}
function openHistory(){ renderHistory(); openDlg(histDlg); }

/* ================= Polling ================= */
function applyData(data){
  recs = {};
  data.responses.forEach(function(r){ recs[r.id] = r; });
  hist = data.history || [];
  live = true; offline = false;
  syncDom(); updateStatus(); refreshModes();
  if (histDlg.open) renderHistory();
}
var polling = false;
async function poll(){
  if (polling) return; polling = true;
  var started = Date.now();
  try {
    var data = await api('GET');
    if (lastWriteDone <= started) { applyData(data); showBanner(''); }
  } catch(e){
    offline = true; updateStatus();
    if (!live) showBanner('Could not reach the server. The page will keep retrying. If this persists, the site’s function may not be deployed yet.');
  } finally { polling = false; }
}

build();
updateStatus();
poll();
setInterval(function(){ if (!document.hidden) poll(); }, 5000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });
window.addEventListener('focus', poll);
window.addEventListener('beforeunload', function(e){
  var dirty = $$all('.grp[data-state="draft"], .grp[data-state="editing"]').some(function(g){ return $('.f-name', g).value.trim() || $('.f-text', g).value.trim(); });
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});

})();
</script>
</body>
</html>
